  // 이름 입력 창. reason: 'join'(처음 참가) | 'change'(바꾸기)
  function askName(reason, onSaved){
    const form=document.createElement('div'); form.className='rk-form';
    const p=document.createElement('p');
    p.textContent = reason==='change' ? 'Pick a new name for the world ranking.'
      : 'Enter a name to put your score on the world ranking.';
    const input=document.createElement('input');
    input.type='text'; input.maxLength=12; input.autocomplete='off'; input.spellcheck=false;
    input.setAttribute('autocapitalize','off'); input.placeholder='YOUR NAME';
    input.value=PBRank.getName();
    const hint=document.createElement('div'); hint.className='rk-hint';
    hint.textContent='3–12 letters, numbers or _';
    const err=document.createElement('div'); err.className='rk-err';
    const save=document.createElement('button'); save.className='rk-save'; save.textContent='SAVE';
    form.append(p, input, hint, err, save);
    const close=JPI.modal(reason==='change'?'CHANGE NAME':'YOUR NAME', form, null, reason==='change'?'CANCEL':'LATER');
    input.addEventListener('input', ()=>{ input.value=input.value.replace(/[^A-Za-z0-9_]/g,''); err.textContent=''; });
    async function submit(){
      const e=PBRank.validName(input.value);
      if(e){ err.textContent=e; return; }
      save.disabled=true;
      try{ await PBRank.setName(input.value); }
      catch(x){ err.textContent=x.message; save.disabled=false; return; }
      close();
      if(onSaved) onSaved();
    }
    save.addEventListener('click', submit);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    // 바로 입력할 수 있게 (휴대폰은 누른 순간에 포커스를 줘야 키보드가 뜸)
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    input.focus();
  }

  function rankRow(rank, d, me){
    const row=document.createElement('div');
    row.className='rk-row'+(rank<=3?' g'+rank:'')+(me?' me':'');
    const n=document.createElement('span'); n.className='n'; n.textContent='#'+rank;
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=d.name+(me?'  (YOU)':'');
    const sc=document.createElement('span'); sc.className='s'; sc.textContent=d.score;
    row.append(n, nm, sc);
    return row;
  }

  function openRanking(){
    const body=document.createElement('div');
    body.style.cssText='display:flex;flex-direction:column;gap:14px;';
    JPI.modal('RANKING', body);
    const online=PBRank.enabled();
    // 세 칸: 이번 주(세계) / 전체(세계) / 내 기록(이 기기의 최고 5판)
    let which = online ? 'week' : 'mine';
    const tabs=document.createElement('div'); tabs.className='rk-tabs';
    const tWeek=document.createElement('button'); tWeek.textContent='THIS WEEK';
    const tAll=document.createElement('button'); tAll.textContent='ALL TIME';
    const tMine=document.createElement('button'); tMine.textContent='MY BEST';
    tabs.append(tWeek, tAll, tMine);
    const note=document.createElement('div'); note.className='rk-note';
    const you=document.createElement('div'); you.className='rk-you';
    const list=document.createElement('div'); list.className='rk-list';
    const me=document.createElement('div'); me.className='rk-me';
    body.append(tabs, note, you, list, me);
    tWeek.addEventListener('click', ()=>{ which='week'; load(); });
    tAll.addEventListener('click', ()=>{ which='all'; load(); });
    tMine.addEventListener('click', ()=>{ which='mine'; load(); });

    function showMine(){
      note.textContent='Your top 5 games on this device.';
      you.style.display='none';
      list.innerHTML='';
      const h=loadHistory();
      if(!h.length){ list.innerHTML='<div class="rk-msg">No games yet. Press START to play!</div>'; return; }
      h.forEach((g,i)=>{
        const row=rankRow(i+1, { name:'LEVEL '+g.l+'  ·  '+g.d, score:g.s }, false);
        list.appendChild(row);
      });
    }

    function renderMe(){
      me.innerHTML='';
      const name=PBRank.getName();
      const label=document.createElement('span');
      const btn=document.createElement('button'); btn.className='rk-link';
      if(name){
        label.innerHTML='You: <b></b>'; label.querySelector('b').textContent=name;
        btn.textContent='CHANGE NAME';
        btn.addEventListener('click', ()=>askName('change', ()=>{ renderMe(); load(); }));
      }else{
        label.textContent='Set a name to join the ranking.';
        btn.textContent='SET NAME';
        // 이름을 정하면 다음 판부터 순위표에 올라감
        btn.addEventListener('click', ()=>askName('join', ()=>{ renderMe(); load(); }));
      }
      me.append(label, btn);
    }

    let seq=0;
    async function load(){
      const my=++seq;
      tWeek.classList.toggle('on', which==='week');
      tAll.classList.toggle('on', which==='all');
      tMine.classList.toggle('on', which==='mine');
      me.style.display = online ? '' : 'none';
      if(which==='mine'){ seq++; showMine(); return; }
      if(!online){
        note.textContent=''; you.style.display='none';
        list.innerHTML='<div class="rk-msg">The world ranking is coming soon.<br>Your own records are in MY BEST.</div>';
        return;
      }
      note.textContent = which==='week' ? 'Resets every Monday (UTC). Top '+PBRank.TOP_N+' shown.' : 'Best scores of all time. Top '+PBRank.TOP_N+' shown.';
      list.innerHTML='<div class="rk-msg">Loading…</div>';
      you.style.display='none';
      try{
        const [rows, uid] = await Promise.all([PBRank.top(which), PBRank.myUid()]);
        const best=PBRank.myBest(which);
        const mine = best>0 && !rows.some(r=>r.uid===uid) ? await PBRank.rankOf(which, best) : null;
        if(my!==seq) return;
        // 맨 위에 내 순위 요약 (목록이 길어도 바로 보이게)
        const inTop=rows.findIndex(r=>r.uid===uid);
        const myRank = inTop>=0 ? rows.filter(r=>r.score>rows[inTop].score).length+1 : mine ? mine.rank : 0;
        if(PBRank.getName()){
          you.innerHTML = myRank
            ? 'YOUR RANK <b>#'+myRank+'</b> <span>· '+best+' pts</span>'
            : '<span>Not ranked '+(which==='week'?'this week':'yet')+'. Play a game to get on the board!</span>';
          you.style.display='block';
        }
        list.innerHTML='';
        if(!rows.length){
          list.innerHTML='<div class="rk-msg">No scores yet'+(which==='week'?' this week':'')+'. Be the first!</div>';
          return;
        }
        // 같은 점수는 같은 순위
        let rank=0, prev=null;
        rows.forEach((r,i)=>{ if(r.score!==prev){ rank=i+1; prev=r.score; } list.appendChild(rankRow(rank, r, r.uid===uid)); });
        if(mine){
          const gap=document.createElement('div'); gap.className='rk-gap'; gap.textContent='⋮';
          list.append(gap, rankRow(mine.rank, { name:PBRank.getName(), score:best }, true));
        }
      }catch(e){
        if(my!==seq) return;
        list.innerHTML='';
        const m=document.createElement('div'); m.className='rk-msg';
        m.textContent="Can't reach the world ranking right now. Check your internet connection.";
        const retry=document.createElement('button'); retry.className='rk-link'; retry.textContent='TRY AGAIN';
        retry.style.marginTop='10px';
        retry.addEventListener('click', load);
        m.appendChild(document.createElement('br')); m.appendChild(retry);
        list.appendChild(m);
      }
    }
    if(online) renderMe();
    load();
  }
  document.getElementById('rank-btn').addEventListener('click', openRanking);

  // 게임 오버 화면: 순위표에 올리고 이번 주 내 순위를 보여줌
  function rankAfterGame(score, lv){
    rankLine.style.display='none'; rankLine.innerHTML='';
    if(!PBRank.enabled() || score<=0) return;
    if(!PBRank.getName()){
      const join=document.createElement('span'); join.className='join'; join.textContent='JOIN THE WORLD RANKING';
      join.addEventListener('click', ()=>askName('join', ()=>rankAfterGame(score, lv)));
      rankLine.appendChild(join);
      rankLine.style.display='block';
      // 처음 한 번은 직접 물어봄
      let asked=false; try{ asked=localStorage.getItem(NAME_ASKED)==='1'; }catch(e){}
      if(!asked){
        try{ localStorage.setItem(NAME_ASKED,'1'); }catch(e){}
        setTimeout(()=>askName('join', ()=>rankAfterGame(score, lv)), 700);
      }
      return;
    }
    rankLine.innerHTML='<span class="sub">Checking world rank…</span>';
    rankLine.style.display='block';
    const shown=overlayTitle.textContent;
    const stale=()=>overlayTitle.textContent!==shown || overlay.classList.contains('hidden');
    PBRank.submit(score, lv).then(async res=>{
      if(res.failed){ if(!stale()) rankLine.innerHTML='<span class="sub">Offline: your score will be sent next time.</span>'; return; }
      const best=PBRank.myBest('week');
      const r=await PBRank.rankOf('week', best);
      if(stale() || !r) return;
      // 두 줄로: 이번 주 순위 / 한 칸 올라가려면 몇 점 더
      const sub=[];
      if(res.week) sub.push('New weekly best!');
      else sub.push('Your best this week: '+best);
      if(r.rank===1) sub.push('No. 1 in the world!');
      else if(r.toNext>0) sub.push(r.toNext+' more to move up');
      rankLine.innerHTML='<div>WORLD RANK THIS WEEK&nbsp; <b>#'+r.rank+'</b></div><div class="sub">'+sub.join(' · ')+'</div>';
    }).catch(()=>{
      if(!stale()) rankLine.innerHTML='<span class="sub">Couldn\'t load the world rank right now.</span>';
    });
  }
  if(PBRank.enabled()) PBRank.flush().catch(()=>{});

  // 화면이 작아 글이 넘치면 메뉴 전체를 살짝 줄여서 위아래가 잘리지 않게
  const ovInner=document.getElementById('ov-inner');
  function fitOverlay(){
    ovInner.style.transform='';
    const cs=getComputedStyle(overlay);
    const avail=overlay.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    const h=ovInner.offsetHeight;
    if(avail>0 && h>avail) ovInner.style.transform='scale('+(avail/h).toFixed(3)+')';
  }
  new ResizeObserver(fitOverlay).observe(ovInner);
  window.addEventListener('resize', fitOverlay);
  if(document.fonts) document.fonts.ready.then(fitOverlay);

  document.getElementById('ver').textContent='v'+APP_VERSION;
  (function warm(t){ setTimeout(()=>{ if(t>=PLANETS.length) return; if(!running) texture(t); warm(running ? t : t+1); }, t ? 150 : 1500); })(0);
  // 업데이트 기록 (SETTINGS → WHAT'S NEW)
  function openLog(){
    const box=document.createElement('div'); box.className='jpi-help';
    for(const [d,v,t] of APP_LOG){ const p=document.createElement('p'); p.textContent='v'+v+'  ·  '+d+'\n'+t; p.style.whiteSpace='pre-line'; box.appendChild(p); }
    JPI.modal("WHAT'S NEW", box);
  }
  // 시작 시: 저장본 있으면 '이어하기' 메뉴 표시
  showMenu();
})();
</script>
</body>
</html>
