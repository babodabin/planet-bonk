<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Planet Bonk</title>
<meta name="description" content="Bonk matching planets together to shrink them, and bonk two Moons to make them vanish. A space physics game.">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Planet Bonk">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* 위: 아이폰은 상태바 칸에 맡기고 조금만 띄움. 그 밖의 전체 화면 기기는 카메라 구멍을 피해 40px
     아래: 홈 줄 자리 일부만 남기고 화면 바닥까지 */
  :root { --top:max(calc(env(safe-area-inset-top, 0px) + 8px), 40px); --sb:max(8px, calc(env(safe-area-inset-bottom, 0px) - 22px)); }
  @supports (-webkit-touch-callout:none) { :root { --top:calc(env(safe-area-inset-top, 0px) + 8px); } }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#000; }
  body {
    font-family:'Special Elite', monospace;
    touch-action:none; user-select:none; -webkit-user-select:none;
    color:#9a9f9f;
  }
  #wrap {
    position:fixed; inset:0; display:flex; flex-direction:column;
    padding-top:var(--top);
    padding-bottom:var(--sb);
  }
  #field-area {
    flex:1; min-height:0; margin:0 4px 4px 4px;
    display:flex; justify-content:center; align-items:flex-end;
  }
  #field-box {
    flex:none; position:relative;
    border:2px solid rgba(255,255,255,0.85);
    border-radius:6px;
    box-shadow:0 0 18px rgba(255,255,255,0.35), inset 0 0 14px rgba(255,255,255,0.12);
    overflow:hidden;
  }
  #game { position:absolute; inset:0; width:100%; height:100%; display:block; }

  #bottom-bar {
    height:82px; position:relative;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:10px 16px 0 16px;
    color:#9a9f9f;
    font-size:clamp(14px, 4vw, 18px);
    letter-spacing:0.12em;
  }
  #next-area { display:flex; flex-direction:column; gap:6px; }
  #next-queue { display:flex; gap:7px; margin-top:4px; align-items:center; }
  .q-ball { width:32px; height:32px; display:block; }
  #right-area { text-align:right; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  /* 첫 화면으로 가는 버튼: 눌리는 버튼처럼 테두리 */
  #menu-btn { cursor:pointer; color:#e8eaea; background:rgba(255,255,255,0.08); border:1.5px solid rgba(255,255,255,0.6);
    border-radius:6px; min-height:44px; padding:0 12px; touch-action:manipulation;
    font-family:inherit; letter-spacing:0.1em; font-size:clamp(12px,3.4vw,15px); }
  #menu-btn:active { color:#000; background:#e8eaea; }

  #launcher {
    position:absolute; left:50%; top:-22px; transform:translateX(-50%);
    width:44px; height:44px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.9);
    box-shadow:0 0 10px rgba(255,255,255,0.5);
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  #launcher .q-ball { width:38px; height:38px; }
  /* 내 우주선: 발사대 바로 아래에서 행성을 쏨 */
  #launcher-ship { position:absolute; top:43px; left:50%; width:34px; height:34px; margin-left:-17px; pointer-events:none; transition:transform .12s; }
  #launcher-ship.kick { transform:translateY(3px); }
  #launcher-name {
    position:absolute; top:76px; left:50%; transform:translateX(-50%);
    font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
    font-size:13px; letter-spacing:0.08em; white-space:nowrap;
    text-shadow:0 0 6px currentColor;
  }

  #overlay {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    /* 아래 바(NEXT·RECORD)와 겹치지 않게 게임판 높이 안에서만 가운데 정렬 */
    padding:calc(var(--top) + 26px) 12px calc(var(--sb) + 118px);
    overflow:hidden;
    background:rgba(0,0,0,0.6);   /* 반투명: 뒤의 우주가 비침 */
    transition:opacity .3s ease;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h1 {
    font-weight:400; color:#e8eaea;
    font-size:clamp(30px, 8.5vw, 52px);
    letter-spacing:0.1em; text-align:center;
    text-shadow:0 0 14px rgba(255,255,255,0.35);
  }
  #overlay .stats { font-size:clamp(15px, 4.2vw, 20px); letter-spacing:0.15em; text-align:center; line-height:1.55; color:#9a9f9f; }
  #overlay .hint {
    font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
    font-size:clamp(12px, 3.4vw, 14px); color:#6c7171;
    text-align:center; line-height:1.7; max-width:290px;
  }
  #overlay button { min-height:44px;
    font-family:'Special Elite','Apple SD Gothic Neo',-apple-system,sans-serif;
    font-size:clamp(15px, 3.6vw, 18px); letter-spacing:0.14em;
    color:#000; background:#e8eaea;
    border:none; border-radius:4px;
    padding:11px 34px; cursor:pointer;
    box-shadow:0 0 16px rgba(255,255,255,0.4);
  }
  #overlay button:active { transform:translateY(2px); }
  /* 보조 버튼(NEW GAME·MENU)도 주 버튼과 같은 크기, 테두리만 */
  #overlay button.secondary {
    color:#e8eaea; background:transparent; border:1.5px solid rgba(255,255,255,0.7);
    box-shadow:0 0 10px rgba(255,255,255,0.15);
  }
  #overlay button.secondary:active { transform:translateY(1px); }
  #overlay #start-btn, #overlay #resume-btn, #overlay #back-btn { min-width:210px; }
  #ov-inner { display:flex; flex-direction:column; align-items:center; gap:8px; transform-origin:center center; }
  #classic-link {
    color:#6c7171; font-size:clamp(13px,3.8vw,16px); letter-spacing:0.15em;
    text-decoration:none; cursor:pointer;
  }
  #classic-link:active { color:#fff; }
  .ov-links { order:4; display:flex; gap:22px; margin-top:16px; }
  .ov-links span { display:inline-flex; align-items:center; min-height:44px; padding:0 14px;
    color:#9a9f9f; font-size:clamp(13px,3.8vw,16px); letter-spacing:0.15em; cursor:pointer;
    border-bottom:1px solid #3a3f3f; padding-bottom:2px;
  }
  .ov-links span:active { color:#fff; }
  /* MY PLANETS · RANKING: 작게, 한 줄에 나란히 */
  .ov-row { order:3; display:flex; gap:8px; margin-top:18px; }
  #overlay .ov-row button { min-height:44px;
    font-size:clamp(12px,3.2vw,14px); letter-spacing:0.06em; padding:10px 10px;
    background:transparent; box-shadow:none; border-radius:6px;
  }
  #overlay button#guide-btn { color:#e8eaea; border:1px solid rgba(255,255,255,0.5); }
  #overlay button#daily-btn { color:#9fe0a6; border:1px solid rgba(120,230,140,0.5); }
  #overlay button#rank-btn { color:#ffd98a; border:1px solid rgba(255,210,120,0.6); }
  /* 시작 화면(menu)과 게임 오버(over)에 보이는 것을 나눔 */
  #overlay[data-mode="over"] .ov-row,
  #overlay[data-mode="over"] .ov-links,
  #overlay[data-mode="menu"] #back-btn,
  #overlay[data-mode="over"] #ver { display:none; }
  #ver { order:5; margin-top:14px; font-size:14px; letter-spacing:0.12em; color:#9a9f9f; }
  #overlay button#back-btn { order:1; min-height:48px; margin-top:6px; background:rgba(255,255,255,0.1); border-color:#fff; touch-action:manipulation; }
  #overlay[data-mode="over"] #start-btn { min-height:48px; }
  #overlay.wait { pointer-events:none; }   /* 게임 오버 직후 잘못 눌리는 것 방지 */

  /* 메뉴가 떠 있을 때는 아래 바의 SETTINGS·MENU를 숨김 (메뉴 안의 것과 겹치지 않게) */
  body.ov-open #menu-btn { visibility:hidden; }
  /* 첫 페이지: 게임 화면(테두리·NEXT·RECORD·발사대)을 숨겨 완전히 다른 화면으로 보이게 */
  body.on-menu #bottom-bar { visibility:hidden; }
  body.on-menu #field-box { border-color:transparent; box-shadow:none; }
  .go-score { font-size:clamp(54px,16vw,76px); line-height:1.05; color:#e8eaea; letter-spacing:0.04em;
    text-shadow:0 0 16px rgba(255,255,255,0.35); }
  .go-sub { font-size:clamp(13px,3.6vw,16px); letter-spacing:0.18em; color:#8a9090; }
  .go-best { font-size:clamp(14px,3.8vw,17px); letter-spacing:0.18em; color:#9fe0a6; margin-top:4px;
    text-shadow:0 0 10px rgba(120,230,140,0.45); }
  #rank-line {
    font-family:-apple-system,'Segoe UI',sans-serif; text-align:center; line-height:1.6;
    font-size:clamp(13px,3.6vw,15px); color:#ffd98a; margin:4px 0 6px; max-width:300px;
  }
  #rank-line b { font-family:'Special Elite',monospace; font-weight:400; font-size:1.35em; letter-spacing:0.1em; color:#ffe7b0; }
  #rank-line .sub { color:#c9b88f; font-size:0.9em; }
  #rank-line .join { min-height:44px; line-height:30px;
    display:inline-block; margin-top:2px; padding:6px 16px; cursor:pointer;
    font-family:'Special Elite',monospace; letter-spacing:0.12em; font-size:0.95em;
    color:#ffd98a; border:1px solid rgba(255,210,120,0.6); border-radius:4px;
  }
  #rank-line .join:active { transform:translateY(1px); }

  /* 순위표 · 닉네임 창 */
  .rk-tabs { display:flex; gap:6px; }
  .rk-tabs button { min-height:44px;
    flex:1; font-family:'Special Elite',monospace; font-size:12px; letter-spacing:0.05em;
    padding:7px 4px; border-radius:6px; cursor:pointer;
    background:transparent; color:#7a8080; border:1px solid #3a3f3f;
  }
  .rk-tabs button.on { color:#000; background:#ffd98a; border-color:#ffd98a; }
  .rk-note { font-family:-apple-system,'Segoe UI',sans-serif; font-size:11px; color:#959c9c; text-align:center; margin-top:-8px; }
  .rk-you { text-align:center; font-family:'Special Elite',monospace; font-size:14px; letter-spacing:0.12em; color:#ffd98a;
    background:rgba(255,210,120,0.08); border:1px solid rgba(255,210,120,0.35); border-radius:6px; padding:8px; }
  .rk-you b { font-weight:400; font-size:1.3em; color:#ffe7b0; }
  .rk-you span { font-family:-apple-system,'Segoe UI',sans-serif; letter-spacing:0; font-size:12px; color:#b8a880; }
  .rk-list { display:flex; flex-direction:column; gap:2px; min-height:120px; }
  .rk-row {
    display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:8px;
    padding:6px 8px; border-radius:6px;
    font-family:-apple-system,'Segoe UI',sans-serif; font-size:14px; color:#c8cccc;
  }
  .rk-row:nth-child(odd) { background:rgba(255,255,255,0.03); }
  .rk-row .n { font-family:'Special Elite',monospace; color:#8a9090; }
  .rk-row .s { font-family:'Special Elite',monospace; color:#e8eaea; letter-spacing:0.06em; }
  .rk-row.g1 .n { color:#ffd23b; } .rk-row.g2 .n { color:#d8dde3; } .rk-row.g3 .n { color:#e0a06a; }
  .rk-row.me { background:rgba(255,210,120,0.16) !important; box-shadow:inset 0 0 0 1px rgba(255,210,120,0.5); }
  .rk-row.me .nm { color:#ffe7b0; }
  .rk-gap { text-align:center; color:#4e5454; font-size:13px; line-height:1; }
  .rk-msg { font-family:-apple-system,'Segoe UI',sans-serif; font-size:14px; line-height:1.6; color:#9a9f9f; text-align:center; padding:26px 6px; }
  .rk-me { display:flex; justify-content:space-between; align-items:center; gap:8px;
    font-family:-apple-system,'Segoe UI',sans-serif; font-size:13px; color:#9a9f9f;
    border-top:1px solid #2a2f2f; padding-top:12px; }
  .rk-me b { color:#e8eaea; font-weight:600; }
  .rk-link { min-height:44px; font-family:'Special Elite',monospace; font-size:12px; letter-spacing:0.12em; color:#ffd98a;
    background:none; border:1px solid rgba(255,210,120,0.5); border-radius:6px; padding:5px 10px; cursor:pointer; }
  .rk-form { display:flex; flex-direction:column; gap:10px; }
  .rk-form p { font-family:-apple-system,'Segoe UI',sans-serif; font-size:14px; line-height:1.55; color:#c8cccc; text-align:center; }
  .rk-form input {
    font-family:'Special Elite',monospace; font-size:20px; letter-spacing:0.08em; text-align:center;
    color:#fff; background:#111; border:1px solid #4a5050; border-radius:6px; padding:10px;
    width:100%; outline:none; -webkit-user-select:text; user-select:text; touch-action:manipulation;
  }
  .rk-form input:focus { border-color:#ffd98a; box-shadow:0 0 10px rgba(255,210,120,0.3); }
  .rk-err { font-family:-apple-system,'Segoe UI',sans-serif; font-size:12px; color:#ff8a7a; text-align:center; min-height:16px; }
  .rk-hint { font-family:-apple-system,'Segoe UI',sans-serif; font-size:11px; color:#6c7171; text-align:center; }
  .rk-save { align-self:center; font-family:'Special Elite',monospace; font-size:15px; letter-spacing:0.16em;
    color:#000; background:#ffd98a; border:none; border-radius:4px; padding:9px 30px; cursor:pointer;
    box-shadow:0 0 14px rgba(255,210,120,0.35); }
  .rk-save:disabled { opacity:0.5; }

  /* 새 행성 카드 · 도감 (공통 모달 안에 들어감) */
  .pb-card { display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  .pb-card canvas { width:140px; height:140px; }
  .pb-name { font-family:'Special Elite',monospace; font-size:24px; letter-spacing:0.14em; color:#e8eaea; }
  .pb-type { font-family:-apple-system,'Segoe UI',sans-serif; font-size:12px; letter-spacing:0.08em; color:#8a9090; text-transform:uppercase; }
  .pb-fact { font-family:-apple-system,'Segoe UI',sans-serif; font-size:15px; line-height:1.55; color:#d5dada; }
  .pb-order { font-family:-apple-system,'Segoe UI',sans-serif; font-size:12px; line-height:1.6; color:#8a9090; white-space:pre-line; }
  .pb-size { font-family:-apple-system,'Segoe UI',sans-serif; font-size:13px; color:#9fc4ff; }
  .pb-count { font-family:'Special Elite',monospace; text-align:center; font-size:15px; letter-spacing:0.12em; color:#c8cccc; }
  .pb-note { font-family:-apple-system,'Segoe UI',sans-serif; text-align:center; font-size:11px; color:#959c9c; margin-top:-8px; }
  .pb-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pb-cell {
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px 6px;
    border:1px solid #2a2f2f; border-radius:8px; background:rgba(255,255,255,0.02); cursor:pointer;
  }
  .pb-cell:active { transform:scale(0.97); }
  .pb-cell.locked { cursor:default; }
  .pb-cell canvas { width:56px; height:56px; }
  .pb-cell span { font-family:-apple-system,'Segoe UI',sans-serif; font-size:11px; color:#c8cccc; }
  .pb-cell.locked span { color:#8a9292; }
  .pb-facts { font-family:-apple-system,'Segoe UI',sans-serif; font-size:14px; line-height:1.6; color:#c8cccc;
    display:flex; flex-direction:column; gap:8px; text-align:left; align-self:stretch; }
  .pb-facts p { position:relative; padding-left:14px; }
  .pb-facts p::before { content:'•'; position:absolute; left:0; color:#6c7171; }
  /* 나의 공간 (MY SPACE) */
  #space { position:fixed; inset:0; z-index:50; background:#03050a; display:none; }
  #space.on { display:block; }
  #space canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .sp-top { position:absolute; left:0; right:0; top:calc(var(--top) + 8px); text-align:center; pointer-events:none; }
  .sp-title { color:#e8eaea; font-size:clamp(24px,7vw,34px); letter-spacing:0.12em; text-shadow:0 0 14px rgba(255,255,255,0.35); }
  .sp-sub { font-family:-apple-system,'Segoe UI',sans-serif; font-size:13px; line-height:1.6; color:#9a9f9f; margin-top:4px; }
  .sp-bottom { position:absolute; left:0; right:0; bottom:calc(var(--sb) + 10px); display:flex; justify-content:center; gap:10px; padding:0 12px; }
  .sp-bottom button { font-family:inherit; font-size:clamp(12px,3.4vw,15px); letter-spacing:0.08em; min-height:44px; padding:0 14px;
    border-radius:6px; cursor:pointer; touch-action:manipulation; color:#e8eaea; background:rgba(255,255,255,0.08); border:1.5px solid rgba(255,255,255,0.6); }
  .sp-bottom button:active { color:#000; background:#e8eaea; }
  .sp-rows { display:flex; flex-direction:column; gap:2px; align-self:stretch; }
  .sp-row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:8px; border-radius:6px;
    font-family:-apple-system,'Segoe UI',sans-serif; font-size:14px; color:#9a9f9f; }
  .sp-row:nth-child(odd) { background:rgba(255,255,255,0.04); }
  .sp-row b { font-family:'Special Elite',monospace; font-weight:400; font-size:18px; color:#e8eaea; text-align:right; }
  .sp-row b.soft { font-size:14px; color:#7a8080; }
  .sp-grow { align-self:stretch; font-family:-apple-system,'Segoe UI',sans-serif; font-size:13px; color:#9fe0a6; text-align:center; }
  .ms-list { display:flex; flex-direction:column; gap:6px; text-align:left; }
  .ms-row { display:flex; align-items:center; gap:10px; padding:6px 8px; border:1px solid #2a2f2f; border-radius:8px; }
  .ms-row.on { border-color:#ffd98a; } .ms-row.off { opacity:0.75; }
  .ms-row canvas { flex:none; }
  .pb-card .ms-row canvas { width:44px; height:44px; }
  .ms-tx { display:flex; flex-direction:column; gap:2px; font-family:-apple-system,'Segoe UI',sans-serif; font-size:12px; line-height:1.4; color:#9a9f9f; }
  .ms-tx b { font-family:'Special Elite',monospace; font-weight:400; font-size:13px; letter-spacing:0.06em; color:#e8eaea; }
  .ms-trips { display:flex; flex-direction:column; gap:8px; align-items:stretch; text-align:center; border-top:1px solid #2a2f2f; padding-top:12px; }
  .ms-trips .sp-buy { align-self:center; }
  .ms-trip { display:flex; justify-content:space-between; align-items:center; min-height:44px; padding:0 12px; border-radius:8px; cursor:pointer; color:#d5dada; background:rgba(255,255,255,0.04); border:1px solid #3a3f3f;
    font-family:-apple-system,'Segoe UI',sans-serif; font-size:14px; }
  .ms-trip b { font-family:'Special Elite',monospace; font-weight:400; color:#ffd98a; }
  .ms-trip:disabled { color:#8a9292; cursor:default; } .ms-trip:disabled b { color:#8a9292; }
  .dy-list { display:flex; flex-direction:column; gap:12px; }
  .dy-row { font-family:-apple-system,'Segoe UI',sans-serif; font-size:14px; color:#d5dada; border:1px solid #2a2f2f; border-radius:8px; padding:10px; }
  .dy-row.done { opacity:0.6; }
  .dy-top { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .dy-top b { font-family:'Special Elite',monospace; font-weight:400; color:#ffd98a; white-space:nowrap; }
  .dy-num { font-size:12px; color:#8a9090; text-align:right; margin-top:3px; }
  .dy-note { font-family:-apple-system,'Segoe UI',sans-serif; font-size:13px; color:#9a9f9f; text-align:center; }
  .dy-streak { font-family:'Special Elite',monospace; font-size:14px; letter-spacing:0.12em; color:#9fe0a6; text-align:center; }
  .bk { display:flex; flex-direction:column; gap:10px; font-family:-apple-system,'Segoe UI',sans-serif; font-size:13px; line-height:1.55; color:#c8cccc; }
  .bk-code { width:100%; font-family:monospace; font-size:16px; line-height:1.3; color:#d5dada; background:#111; border:1px solid #4a5050; border-radius:6px; padding:8px; resize:none;
    word-break:break-all; touch-action:pan-y; -webkit-user-select:text; user-select:text; }
  .bk-row { display:flex; gap:8px; }
  .bk-btn { flex:1; font-family:'Special Elite',monospace; font-size:14px; letter-spacing:0.08em; min-height:44px; border-radius:6px; cursor:pointer; color:#000; background:#e8eaea; border:1.5px solid #e8eaea; }
  .bk-btn.line { color:#e8eaea; background:transparent; border-color:rgba(255,255,255,0.6); }

<script>
// 오프라인 실행 (PWA)
if('serviceWorker' in navigator){
  // 새 버전이 설치되면 한 번만 새로고침해서 바로 보이게 (처음 설치할 때는 안 함)
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });
  window.addEventListener('load', ()=>{
    // 주소에 버전을 붙여서, 버전이 바뀌면 폰이 새 오프라인 파일을 꼭 받게 함
    navigator.serviceWorker.register('sw.js?v='+APP_VERSION, { updateViaCache:'none' }).then(r=>{
      r.update().catch(()=>{});
      // 앱을 완전히 닫지 않고 다시 열었을 때도 새 버전 확인 (배포할 때는 version.js의 APP_VERSION만 올리면 됨)
      document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') r.update().catch(()=>{}); });
    }).catch(()=>{});
  });
}
</script>

<script>
(function(){
  // ───────── 행성 정의 (크기 순) ─────────
  // size: 기본 반지름 배율 — 규칙: 한 단계마다 약 1.21배씩 커짐 (태양만 특별히 큼)
  // 같은 행성끼리 부딪히면 tier-1로 축소, tier 0(달)끼리는 소멸
  // color: 불꽃·후광·이름표에 쓰는 대표색 (행성 그림 자체는 makeTexture에서 그림)
  const PLANETS=[
    {name:'Moon',    color:'#e6e9ef', size:0.60},
    {name:'Mercury', color:'#b39a84', size:0.73},
    {name:'Mars',    color:'#e8602f', size:0.88},
    {name:'Venus',   color:'#f2c46d', size:1.06},
    {name:'Earth',   color:'#4a90ee', size:1.29},
    {name:'Neptune', color:'#5c7cf0', size:1.56},
    {name:'Uranus',  color:'#8ee3ef', size:1.88},
    {name:'Saturn',  color:'#ead39c', size:2.28},
    {name:'Jupiter', color:'#dda56c', size:2.76},
    {name:'Sun',     color:'#ffd23b', size:4.50}
  ];

  const FRICTION_KEEP = 0.988;
  const FRICTION_SUB = 0.028;
  const STOP_SPEED = 0.05;
  const EDGE = 2.4;            // 테두리 선 두께 보정(시각적으로 표면이 맞닿게)
  const RESTITUTION = 1.0;
  const WALL_BOUNCE = 0.95;
  const TOP_BOUNCE = 0.6;      // 위쪽 벽: 세게 쏴도 튕겨 나와 바로 지지 않게
  const MAX_POWER = 13;
  const POP_RANGE = 1.05;      // 원조: 거의 딱 붙어야(직접 맞혀야) 반응
  const POP_TICK = 8;
  const POP_MIN_SPEED = 1.2;   // 이 속도 이상 부딪힐 때만 축소 (가만히 붙어있으면 안 됨)

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const fieldBox = document.getElementById('field-box');
  const nextQueueEl = document.getElementById('next-queue');
  const launcherBallEl = document.getElementById('launcher-ball');
  const recordLabel = document.getElementById('record-label');
  const menuBtn = document.getElementById('menu-btn');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.querySelector('#overlay h1');
  const overlayStats = document.getElementById('overlay-stats');
  const overlayHint = document.getElementById('overlay-hint');
  const startBtn = document.getElementById('start-btn');

  // 논리 필드 크기 고정: 속도·마찰이 픽셀 단위라, 화면 크기를 따라가면 기기마다 난이도가 달라짐
  const W=360, H=640;
  const BALL_R = Math.max(15, Math.min(W,H)*0.055);
  const BORDER = 2;
  const fieldArea = document.getElementById('field-area');
  let DPR=1, SCALE=1, DPR_MAX=2, idleDrawn=false;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, DPR_MAX);
    const area = fieldArea.getBoundingClientRect();
    SCALE = Math.max(0.1, Math.min((area.width-BORDER*2)/W, (area.height-BORDER*2)/H));
    fieldBox.style.width = (W*SCALE+BORDER*2)+'px';
    fieldBox.style.height = (H*SCALE+BORDER*2)+'px';
    canvas.width = Math.round(W*SCALE*DPR); canvas.height = Math.round(H*SCALE*DPR);
    ctx.setTransform(SCALE*DPR,0,0,SCALE*DPR,0,0);
    spriteCache.clear(); bgCache=null; idleDrawn=false;
    if(queue.length) renderQueue();
  }
  function pointerPos(e){
    const r = canvas.getBoundingClientRect();
    return { x:(e.clientX-r.left)/SCALE, y:(e.clientY-r.top)/SCALE };
  }
  window.addEventListener('resize', resize);

  // ───────── 사운드 / 음악 (Gymnopédie 로파이) ─────────
  let audioCtx=null;
  const SFX_VOL={ low:0.1, mid:0.2, high:0.4 }, BGM_VOL={ low:0.22, mid:0.45, high:0.9 };
  function sound(freq, dur, type, vol){
    if(!JPI.on('sfx')) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=type||'sine';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(60,freq*0.4), audioCtx.currentTime+dur);
      g.gain.setValueAtTime((vol||0.15)*SFX_VOL[JPI.volume()], audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+dur+0.02);
    }catch(e){}
  }

  const bgm=(function(){
    let ac=null, master=null, timer=null, nextBar=0, barIdx=0, on=false;
    const BPM=64, BEAT=60/BPM, BAR=3*BEAT;
    const accA={bass:43, ch:[59,62,66]};
    const accB={bass:38, ch:[57,61,66]};
    const REST=[];
    const mel=[
      REST, REST,
      [[0,78,1],[1,81,1],[2,79,1]],
      [[0,78,1],[1,73,1],[2,71,1]],
      [[0,73,1],[1,74,1],[2,69,1]],
      [[0,66,3]],
      [[0,78,1],[1,81,1],[2,79,1]],
      [[0,78,1],[1,73,1],[2,71,1]],
      [[0,73,1],[1,74,1],[2,69,1]],
      [[0,69,3]],
      REST, REST
    ];
    const f=m=>440*Math.pow(2,(m-69)/12);
    function ensure(){
      if(ac) return;
      ac=new (window.AudioContext||window.webkitAudioContext)();
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2000; lp.Q.value=0.4;
      master=ac.createGain(); master.gain.value=0;
      master.connect(lp); lp.connect(ac.destination);
      const len=ac.sampleRate*2;
      const buf=ac.createBuffer(1,len,ac.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*(Math.random()<0.012?0.5:0.018); }
      const ns=ac.createBufferSource(); ns.buffer=buf; ns.loop=true;
      const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1400;
      const ng=ac.createGain(); ng.gain.value=0.055;
      ns.connect(hp); hp.connect(ng); ng.connect(master);
      ns.start();
    }
    function tone(midi,t,dur,type,vol,attack){
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=f(midi);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol,t+(attack||0.02));
      g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t+dur+0.05);
    }
    function scheduleBar(t,idx){
      const acc=(idx%2===0)?accA:accB;
      tone(acc.bass, t, BAR*0.95, 'sine', 0.10, 0.04);
      acc.ch.forEach((m,i)=>{
        tone(m, t+BEAT+i*0.035, BEAT*1.9, 'sine', 0.045, 0.08);
      });
      const bar=mel[idx%mel.length];
      for(const [b,m,len] of bar){
        tone(m, t+b*BEAT, len*BEAT*1.05, 'sine', 0.105, 0.05);
        tone(m+12, t+b*BEAT, len*BEAT, 'sine', 0.018, 0.05);
      }
    }
    function loop(){
      while(nextBar<ac.currentTime+0.8){
        scheduleBar(nextBar,barIdx++);
        nextBar+=BAR;
      }
    }
    return {
      toggle(){
        ensure();
        if(ac.state==='suspended') ac.resume();
        on=!on;
        if(on){
          nextBar=ac.currentTime+0.1; barIdx=0;
          master.gain.cancelScheduledValues(ac.currentTime);
          master.gain.setValueAtTime(master.gain.value, ac.currentTime);
          master.gain.linearRampToValueAtTime(BGM_VOL[JPI.volume()], ac.currentTime+1.5);
          timer=setInterval(loop,200); loop();
        }else{
          master.gain.cancelScheduledValues(ac.currentTime);
          master.gain.setValueAtTime(master.gain.value, ac.currentTime);
          master.gain.linearRampToValueAtTime(0, ac.currentTime+0.6);
          clearInterval(timer);
        }
        return on;
      },
      setVolume(){
        if(!on || !master) return;
        master.gain.cancelScheduledValues(ac.currentTime);
        master.gain.setValueAtTime(master.gain.value, ac.currentTime);
        master.gain.linearRampToValueAtTime(BGM_VOL[JPI.volume()], ac.currentTime+0.3);
      },
      // 앱이 안 보일 때는 음악 타이머와 소리를 완전히 멈춤 (배터리·발열)
      sleep(){ if(!ac) return; clearInterval(timer); timer=null; if(ac.state==='running') ac.suspend().catch(()=>{}); },
      wake(){ if(!ac || !on) return; ac.resume().catch(()=>{}); nextBar=Math.max(nextBar, ac.currentTime+0.1); if(!timer){ timer=setInterval(loop,200); loop(); } },
      isOn(){ return on; }
    };
  })();

  // ───────── 게임 상태 ─────────
  let balls=[], particles=[];
  let level=1, popped=0, until=5, record=0;
  let queue=[];          // queue[0]=발사대, [1..3]=NEXT (행성 tier 번호)
  let running=false;
  let aiming=false, aimX=0, aimY=0;
  let pairCooldown = new Map();
  let flashLevel=0;
  let ballSeq=0;
  const spriteCache=new Map();
  let bgCache=null;
  resize();

  // 판번호: 같은 번호면 같은 순서로 행성·방해 요소가 나옴 (문제 생긴 판을 다시 볼 수 있게)
  let gameSeed=0, rngState=0;
  function rand(){
    rngState=(rngState+0x6D2B79F5)|0;
    let t=Math.imul(rngState^(rngState>>>15), 1|rngState);
    t=(t+Math.imul(t^(t>>>7), 61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  }
  function newSeed(){ gameSeed=Date.now()%1e9; rngState=gameSeed; }
  // 난이도: 레벨 1은 6번, 그다음부터 2번씩 더
  function quotaFor(lv){ return 4+lv*2; }
  // 중력: 움직이는 행성이 아래로 휘어 떨어짐 (무거운 행성은 덜 휘게 해서 쏠 수는 있게)
  // 레벨마다 세지게 하면 레벨 9에서 아무도 못 넘는 벽이 생겨서 일정하게 둠 (2026-11-26 시험 결과)
  function pullOf(tier){ return 0.018/Math.sqrt(PLANETS[tier].size); }
  // 가장 작은 달부터 시작. 작은 행성은 금방, 큰 행성일수록 훨씬 늦게 나옴
  const UNLOCK=[1,2,3,5,6,7,8,9,11,13];
  function maxTier(){ let t=0; while(t+1<UNLOCK.length && UNLOCK[t+1]<=level) t++; return t; }
  // 큰 행성일수록 조금 더 자주 나옴 (판이 더 빨리 참). 태양은 너무 커서 보통 확률 그대로
  function tierWeight(t){ return t===PLANETS.length-1 ? 1 : 1 + 0.5*t; }
  function randTier(){
    const top=maxTier();
    let sum=0;
    for(let t=0;t<=top;t++) sum+=tierWeight(t);
    let r=rand()*sum;
    for(let t=0;t<=top;t++){ r-=tierWeight(t); if(r<0) return t; }
    return top;
  }
  function radiusOf(tier){ return BALL_R*PLANETS[tier].size; }
  function massOf(tier){ const r=PLANETS[tier].size; return r*r; }   // 면적 기준: 태양이 무겁되 과하지 않게

  function refillQueue(){
    while(queue.length<4) queue.push(randTier());
    renderQueue();
  }
  // 작은 캔버스(대기열·카드·도감)에 필드와 같은 방식으로 행성을 그림. 돌려주는 draw(rot, t)로 자전시킬 수 있음
  // fill=false: 큰 행성일수록 조금 크게 (대기열) / fill=true: 모두 칸에 꽉 차게 (카드·도감)
  function planetPainter(cv, tier, css, fill, skinTex){
    css = css || cv.clientWidth || 32;
    const d = Math.min(window.devicePixelRatio||1, 2);
    cv.width = Math.round(css*d); cv.height = Math.round(css*d);
    const pad = tier===9 ? 1.75 : padOf(tier);
    const r = fill ? css/2/pad*0.94 : Math.min(css*0.42*Math.min(1, 0.55+0.16*PLANETS[tier].size), css/2/pad);
    const tex = skinTex || texture(tier), map = sphereMap(Math.max(3, Math.round(r*d)), tex, tier===9);
    const surf = document.createElement('canvas'); surf.width = surf.height = map.size;
    const sc = surf.getContext('2d'), img = sc.createImageData(map.size, map.size);
    const c = cv.getContext('2d');
    return function draw(rot, t){
      paintSurface(map, tex, (rot||0)*tex.w, img); sc.putImageData(img, 0, 0);
      c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cv.width,cv.height);
      c.setTransform(d,0,0,d, css*d/2, css*d/2);
      if(tier===9) sunCorona(c, r, t||0);
      composePlanet(c, tier, r, surf);
    };
  }
  function paintQueuePlanet(cv, tier){ planetPainter(cv, tier)(0, 0); }
  const launcherShip=document.getElementById('launcher-ship');
  function renderShip(boost){
    PBShip.paintLauncher(launcherShip, performance.now()/1000, boost);
  }
  function renderQueue(){
    renderShip(false);
    paintQueuePlanet(launcherBallEl, queue[0]);
    const ln=document.getElementById('launcher-name');
    ln.textContent=PLANETS[queue[0]].name;
    ln.style.color=PLANETS[queue[0]].color;
    nextQueueEl.innerHTML='';
    for(let i=1;i<4;i++){
      const cv=document.createElement('canvas');
      cv.className='q-ball';
      nextQueueEl.appendChild(cv);
      paintQueuePlanet(cv, queue[i]);
    }
  }

  function updateHUD(){
    recordLabel.innerHTML='RECORD&nbsp;&nbsp;'+record;
  }

  // ── 기록 저장 ──
  function loadRecord(){
    try{ record = parseInt(localStorage.getItem('pb-record')) || 0; }
    catch(e){ record = 0; }
  }
  function loadHistory(){
    try{ return JSON.parse(localStorage.getItem('pb-history')) || []; }
    catch(e){ return []; }
  }
  function saveScore(){
    try{
      localStorage.setItem('pb-record', String(record));
      localStorage.setItem('pb-last', JSON.stringify({ s: popped, l: level }));
      const h = loadHistory();
      h.push({ s: popped, l: level, d: new Date().toISOString().slice(0,10) });
      h.sort((x,y)=>y.s-x.s);
      localStorage.setItem('pb-history', JSON.stringify(h.slice(0,5)));
    }catch(e){}
  }

  // ── 진행 중 게임 자동 저장/복원 ──
  const SAVE_KEY='pb-save'; let saveCount=0;
  function saveProgress(){
    if(!running) return;
    PBSpace.save(); PBDaily.save();
    try{
      // 소수점은 3자리까지만 (저장 크기를 줄여 폰이 더 빨리·자주 디스크에 씀)
      const r3=v=>Math.round(v*1000)/1000;
      const slim=balls.map(b=>({ id:b.id, x:r3(b.x), y:r3(b.y), vx:r3(b.vx), vy:r3(b.vy), tier:b.tier, r:r3(b.r), armed:b.armed, dead:b.dead }));
      const data={ sv:SAVE_VERSION, seed:gameSeed, rs:rngState, balls:slim, level, popped, until, queue, ballSeq, record, fw:W, fh:H, gd:gameDust, sh:shields, sg:shipsThisGame, jk:junk, ev:saveEvents() };
      // 바로 앞 저장본을 남겨 둠 (새 저장이 깨지면 그걸로 되찾음)
      // 앞 저장본은 다섯 번에 한 번만 남김 (매번 두 벌씩 쓰면 저장이 느려짐)
      if(++saveCount%5===1){ const old=localStorage.getItem(SAVE_KEY); if(old && validSave(parseSave(old))) localStorage.setItem(SAVE_KEY+'-prev', old); }
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    }catch(e){}
  }
  function clearProgress(){ try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_KEY+'-prev'); }catch(e){} }
  // 저장 형식 번호. 형식이 바뀌면 숫자를 올리고 migrateSave에 옮기는 법을 적음
  const SAVE_VERSION=2;
  function parseSave(raw){ try{ return migrateSave(JSON.parse(raw)); }catch(e){ return null; } }
  function migrateSave(d){
    if(!d || typeof d!=='object') return null;
    if(!d.sv){   // 1: v2.2 전 저장 — 판번호가 없음
      d.sv=2; d.seed=0; d.rs=0;
    }
    return d;
  }
  const okNum=(v,max)=>typeof v==='number' && isFinite(v) && Math.abs(v)<=max;
  function validSave(d){
    return !!d && Array.isArray(d.balls) && d.balls.length<=300 && Array.isArray(d.queue) && d.queue.length>=4
      && d.queue.every(t=>Number.isInteger(t) && t>=0 && t<PLANETS.length)
      && d.balls.every(b=>b && Number.isInteger(b.tier) && b.tier>=0 && b.tier<PLANETS.length && okNum(b.x,1e4) && okNum(b.y,1e4) && okNum(b.vx,1e3) && okNum(b.vy,1e3))
      && okNum(d.level,1e4) && d.level>=1 && okNum(d.popped,1e7);
  }
  function loadProgress(){
    try{
      for(const key of [SAVE_KEY, SAVE_KEY+'-prev']){
        const raw=localStorage.getItem(key);
        if(!raw) continue;
        const d=parseSave(raw);
        if(validSave(d)){
          // 잘 읽힌 저장은 앞 저장본으로도 남겨 둠 (다음에 깨져도 되찾을 수 있게)
          if(key===SAVE_KEY && !localStorage.getItem(SAVE_KEY+'-prev')) localStorage.setItem(SAVE_KEY+'-prev', raw);
          return d;
        }
      }
    }catch(e){}
    return null;
  }
  function restoreGame(d){
    balls=d.balls||[]; particles=d.particles||[];
    level=Number(d.level)||1; popped=Number(d.popped)||0; until=Number(d.until)||quotaFor(level);
    queue=d.queue; ballSeq=Number(d.ballSeq)||0; record=Math.max(record, Number(d.record)||0);
    // 행성 크기 표가 바뀌었을 수 있으니 반지름은 항상 지금 기준으로 다시 맞춤
    for(const b of balls) b.r = radiusOf(b.tier);
    // 필드 크기를 고정하기 전(화면 픽셀 기준)에 저장된 게임은 새 필드 안으로 옮겨 놓음
    if(d.fw!==W || d.fh!==H){
      for(const b of balls){
        b.vx = 0; b.vy = 0;
        b.x = Math.max(b.r, Math.min(W-b.r, b.x));
        b.y = Math.max(b.r, Math.min(H-b.r-BALL_R*3, b.y));
      }
    }
    pairCooldown.clear(); running=true;
    gameSeed=Number(d.seed)||0; if(!gameSeed) newSeed();
    resetEvents(); restoreJunk(d.jk); restoreEvents(d.ev); gameDust=d.gd||0;
    // 난수 상태는 맨 마지막에 되돌림 (resetEvents가 난수를 써서 순서가 달라지지 않게)
    if(d.rs) rngState=Number(d.rs)|0; dailyWon=0; shipsThisGame=d.sg||0;
    shields=typeof d.sh==='number' ? d.sh : PBSpace.shields()+PBShip.extraShields();
    renderQueue(); updateHUD();
  }

  function newGame(){
    balls=[]; particles=[]; pairCooldown.clear();
    newSeed(); resetEvents(); gameDust=0; dailyWon=0; shipsThisGame=0; shields=PBSpace.shields()+PBShip.extraShields();
    level=1; popped=0; until=quotaFor(1);
    queue=[]; refillQueue();
    running=true;
    updateHUD();
    saveProgress();
  }

  // ───────── 발사 ─────────
  const launcherPos = ()=>({ x: W/2, y: H - BALL_R*0.4 });

  function fire(dx, dy, power){
    const mag = Math.hypot(dx,dy);
    if(mag<0.001) return;
    const lp = launcherPos();
    const tier=queue[0];
    const r=radiusOf(tier);
    // 무게 반영: 같은 힘이라도 무거운 행성은 느리게 출발 (달은 쌩, 태양은 묵직하게)
    const heavy = 1/Math.pow(PLANETS[tier].size, 0.85);
    const v = Math.min(power, MAX_POWER) * PBShip.shotPower() * heavy;
    const firedBall=ballSeq;
    balls.push({
      id: ballSeq++,
      x: lp.x, y: lp.y - r,
      vx: dx/mag*v, vy: dy/mag*v,
      tier: tier, r: r,
      armed: false, dead: false
    });
    queue.shift();
    refillQueue();
    onShot(firedBall);
    renderShip(true); launcherShip.classList.add('kick');
    setTimeout(()=>{ renderShip(false); launcherShip.classList.remove('kick'); }, 220);
    sound(220, 0.1, 'triangle', 0.12);
    saveProgress();
  }

  fieldBox.addEventListener('pointerdown', e=>{
    if(!running) return;
    const p = pointerPos(e);
    aiming=true;
    aimX=p.x; aimY=p.y;
  });
  fieldBox.addEventListener('pointermove', e=>{
    if(!aiming) return;
    const p = pointerPos(e);
    aimX=p.x; aimY=p.y;
  });
  function endAim(){
    if(!aiming || !running){ aiming=false; return; }
    aiming=false;
    const lp = launcherPos();
    const dx = aimX-lp.x, dy = aimY-lp.y;
    if(dy>=-10) return;
    const dist = Math.hypot(dx,dy);
    const power = dist/H * MAX_POWER * 2.1;
    fire(dx, dy, power);
  }
  window.addEventListener('pointerup', endAim);
  window.addEventListener('pointercancel', ()=>{aiming=false;});
  // 비행접시 능력: 발사대를 누르면 다음 행성과 바꿈
  document.getElementById('launcher').addEventListener('click', ()=>{
    if(!running || JPI.isOpen() || !PBShip.canSwap()) return;
    [queue[0],queue[1]]=[queue[1],queue[0]];
    renderQueue(); sound(480, 0.1, 'sine', 0.12); saveProgress();
  });

  // ───────── 별가루: 박치기·레벨 업·우주선 잡기로 모아 MY SPACE에서 씀 (화면에는 숫자로만 보여 우주는 어둡게) ─────────
  let gameDust=0, toast=null;
  function gain(n){ gameDust+=n; PBSpace.earn(n); daily('dust', n); }
  // 키운 행성일수록 박치기할 때 별가루를 더 줌
  function bonkDust(t){ daily('bonk', t); gain((t>=7 ? 3 : t>=4 ? 2 : 1)+PBSpace.bonkBonus(t)); }
  // 매일 목표에 알림. 깬 목표가 있으면 위쪽에 잠깐 표시
  let dailyWon=0;
  function daily(kind, v){
    const won=PBDaily.on(kind, v);
    if(won){ dailyWon+=won; toast={ text:'DAILY GOAL  ✦ '+won, color:'#9fe0a6', life:1.4 }; sound(990, 0.3, 'sine', 0.16); }
  }
  // MY PLANET(지구)을 키우면 생기는 방어막: 행성이 아래로 빠져도 한 번 막아 줌
  let shields=0, shipsThisGame=0;

  // ───────── 지나가는 우주선 · 후반 방해 요소 ─────────
  let dropIn=3;                   // 몇 번 더 쏘면 위에서 행성이 하나 떨어지는지
  let sinkLeft=0, sinkBefore=0, liftLeft=0;   // liftLeft: 박치기할 때마다 판 전체가 조금 올라감 (잘할수록 오래 버팀)   // 중력: 남은 거리, 이 번호보다 먼저 쏜 행성만 내려감
  let flyer=null, flyerIn=6, flyersThisLevel=0;
  // 방해 요소: 레벨이 오를수록 종류와 수가 늘어남
  //  LV3 우주 쓰레기(막음) → LV5 우주돌(날아와 밀어냄) → LV7 블랙홀(끌어당겨 아래로 내던짐) → LV9 태양 폭풍
  let junk=[], roids=[], holes=[], flare=null, junkIn=2, roidIn=2, holeIn=3, flareIn=4, warned={};
  function junkMax(){ return level<3 ? 0 : Math.min(7, 1+Math.floor((level-2)/1.5)); }
  function roidMax(){ return level<5 ? 0 : Math.min(4, 1+Math.floor((level-5)/3)); }
  function holeMax(){ return level<7 ? 0 : Math.min(3, 1+Math.floor((level-7)/4)); }
  function sinkPerShot(){ return Math.min(20, 4+2*(level-1)); }
  function resetEvents(){
    sinkLeft=0; liftLeft=0; dropIn=3; flyer=null; flyerIn=5+Math.floor(rand()*4); flyersThisLevel=0; toast=null;
    junk=[]; roids=[]; holes=[]; flare=null; junkIn=1; roidIn=2; holeIn=2; flareIn=3; warned={};
  }
  // 저장했다 이어 해도 우주 쓰레기는 그대로 남음
  function restoreJunk(list){
    if(!Array.isArray(list)) return;
    junk=list.slice(0,7).map(k=>({ x:Number(k&&k.x), y:Number(k&&k.y), r:Number(k&&k.r), hp:Math.min(3,Number(k&&k.hp)), a:Number(k&&k.a)||0 }))
      .filter(k=>k.x>0 && k.x<W && k.y>0 && k.y<H && k.r>4 && k.r<20 && k.hp>0);
  }
  // 메뉴로 나갔다 CONTINUE 해도 블랙홀·우주돌·다음 순서가 그대로 (나갔다 오면 쉬워지는 편법 막기)
  function saveEvents(){ return { dropIn, junkIn, roidIn, holeIn, flareIn, flyerIn, flyersThisLevel, sinkLeft, liftLeft, sinkBefore, roids, holes, flare, flyer }; }
  function restoreEvents(e){
    if(!e || typeof e!=='object') return;
    const n=(v,d,max)=>typeof v==='number' && isFinite(v) && Math.abs(v)<=max ? v : d;
    dropIn=n(e.dropIn,dropIn,999); junkIn=n(e.junkIn,junkIn,999); roidIn=n(e.roidIn,roidIn,999); holeIn=n(e.holeIn,holeIn,999); flareIn=n(e.flareIn,flareIn,999);
    flyerIn=n(e.flyerIn,flyerIn,999); flyersThisLevel=n(e.flyersThisLevel,0,9); sinkLeft=n(e.sinkLeft,0,200); liftLeft=n(e.liftLeft,0,500); sinkBefore=n(e.sinkBefore,0,1e9);
    const obj=(o,keys)=>o && typeof o==='object' && keys.every(k=>typeof o[k]==='number' && isFinite(o[k]) && Math.abs(o[k])<1e5);
    if(Array.isArray(e.roids)) roids=e.roids.slice(0,6).filter(k=>obj(k,['x','y','vx','vy','r','hp','a'])).map(k=>({x:k.x,y:k.y,vx:k.vx,vy:k.vy,r:Math.min(24,k.r),hp:k.hp,a:k.a}));
    if(Array.isArray(e.holes)) holes=e.holes.slice(0,3).filter(z=>obj(z,['x','y','t','life'])).map(z=>({x:z.x,y:z.y,t:z.t,life:Math.min(2000,z.life)}));
    if(obj(e.flare,['t'])) flare={ t:e.flare.t };
    if(obj(e.flyer,['x','y0','y','v','t','dir']) && PBSpace.SHIP_IDS.includes(e.flyer.id)) flyer={ id:e.flyer.id, dir:e.flyer.dir>0?1:-1, x:e.flyer.x, y0:e.flyer.y0, y:e.flyer.y, v:e.flyer.v, t:e.flyer.t };
    warned={ junk:true, roid:true, hole:true, flare:true, drop:true };
  }
  function warn(key, text, color){ if(warned[key]) return; warned[key]=true; toast={ text, color, life:1.2 }; }
  // 쏠 때마다 세어서 우주선과 방해 요소가 나옴
  // 위에서 새 행성이 하나 떨어짐 (지금 레벨에 나오는 종류)
  function dropOne(){
    const t=randTier(), r=radiusOf(t);
    for(let n=0;n<20;n++){
      const x=r+rand()*(W-2*r), y=r+4;
      if(balls.some(b=>Math.hypot(b.x-x,b.y-y)<b.r+r+2)) continue;
      balls.push({ id:ballSeq++, x, y, vx:0, vy:2, tier:t, r, armed:true, dead:false });
      sparks(x, y, PLANETS[t].color, 8, 1.4); warn('drop','INCOMING PLANET','#9fc4ff'); sound(300,0.15,'sine',0.1);
      return;
    }
  }
  function onShot(firedId){
    if(--dropIn<=0){ dropOne(); dropIn=Math.max(2, 4-Math.floor((level-1)/3)); }
    sinkLeft+=sinkPerShot(); sinkBefore=firedId;
    if(!flyer && flyersThisLevel<3 && --flyerIn<=0){ spawnFlyer(); flyerIn=6+Math.floor(rand()*5); }
    if(junk.length<junkMax() && --junkIn<=0){ spawnJunk(); junkIn=level>=10 ? 1 : 2; }
    if(level>=5 && --roidIn<=0){ for(let i=roids.length;i<roidMax();i++) spawnRoid(); roidIn=Math.max(2, 5-Math.floor((level-5)/3)); }
    if(holes.length<holeMax() && --holeIn<=0){ spawnHole(); holeIn=Math.max(2, 5-Math.floor((level-7)/3)); }
    if(level>=9 && !flare && --flareIn<=0){ flare={ t:0 }; flareIn=Math.max(4, 8-Math.floor((level-9)/2)); warn('flare','SOLAR FLARE!','#ffb45c'); sound(200,0.6,'sawtooth',0.1); }
  }
  function spawnJunk(){
    for(let n=0;n<30;n++){
      const x=30+rand()*(W-60), y=110+rand()*320, r=10+rand()*4;
      if(balls.some(b=>Math.hypot(b.x-x,b.y-y)<b.r+r+8) || junk.some(k=>Math.hypot(k.x-x,k.y-y)<52)) continue;
      junk.push({ x, y, r, hp:level>=8 ? 3 : 2, a:rand()*6 });
      warn('junk','SPACE JUNK','#b8c0c6'); return;
    }
  }
  function spawnRoid(){
    const dir=rand()<0.5 ? 1 : -1, sp=1.3+rand()*0.7+Math.min(0.8,(level-5)*0.08);
    roids.push({ x:dir>0 ? -24-rand()*60 : W+24+rand()*60, y:50+rand()*190, vx:dir*sp, vy:0.25+rand()*0.5, r:12+rand()*Math.min(8,level*0.5), hp:3, a:0 });
    warn('roid','ASTEROIDS!','#d0a27a');
  }
  function spawnHole(){
    for(let n=0;n<20;n++){
      const x=W*(0.2+rand()*0.6), y=H*(0.2+rand()*0.32);
      if(holes.some(z=>Math.hypot(z.x-x,z.y-y)<150)) continue;
      holes.push({ x, y, t:0, life:900+Math.min(600,level*30) });
      warn('hole','BLACK HOLE','#b79cff'); return;
    }
  }
  function spawnFlyer(){
    const id=PBSpace.SHIP_IDS[Math.floor(rand()*PBSpace.SHIP_IDS.length)];
    const dir=rand()<0.5 ? 1 : -1, fast=id==='halley';
    flyer={ id, dir, x:dir>0?-30:W+30, y0:80+rand()*190, y:0, v:(fast?1.9:1.1), t:0 };
    flyer.y=flyer.y0; flyersThisLevel++;
  }
  function eventStep(){
    if(liftLeft>0){
      const d=Math.min(0.8, liftLeft); liftLeft-=d;
      for(const b of balls) if(b.armed) b.y=Math.max(b.r, b.y-d);
    }
    if(sinkLeft>0){
      const d=Math.min(0.6, sinkLeft); sinkLeft-=d;
      for(const b of balls) if(b.armed && b.id<sinkBefore) b.y+=d;
    }
    if(flyer){
      const f=flyer; f.t++; f.x+=f.dir*f.v; f.y=f.y0+Math.sin(f.t*0.02)*8;
      if(balls.some(b=>Math.hypot(b.x-f.x,b.y-f.y)<b.r+PBShip.catchReach())) catchFlyer();
      else if(f.x<-40 || f.x>W+40) flyer=null;
    }
    // 우주 쓰레기: 부딪히면 튕겨 나오고, 여러 번 세게 맞히면 부서짐
    for(const k of junk){
      for(const b of balls){
        if(b.dead) continue;
        const dx=b.x-k.x, dy=b.y-k.y, d=Math.hypot(dx,dy), m=b.r+k.r;
        if(d>=m || d<0.0001) continue;
        const nx=dx/d, ny=dy/d, vn=b.vx*nx+b.vy*ny;
        b.x+=nx*(m-d); b.y+=ny*(m-d);
        if(vn<0){ b.vx-=1.7*vn*nx; b.vy-=1.7*vn*ny; if(vn<-1){ k.hp--; sparks(k.x,k.y,'#9aa3aa',6,1.4); sound(150,0.08,'square',0.06); } }
      }
    }
    if(junk.some(k=>k.hp<=0)){ const n=junk.length; junk=junk.filter(k=>k.hp>0); gain(n-junk.length); }
    // 우주돌: 날아가며 행성을 밀어냄
    for(const k of roids){
      k.x+=k.vx; k.y+=k.vy; k.a+=0.03;
      for(const b of balls){
        if(b.dead || !b.armed) continue;
        const dx=b.x-k.x, dy=b.y-k.y, d=Math.hypot(dx,dy), m=b.r+k.r;
        if(d>=m || d<0.0001) continue;
        const nx=dx/d, ny=dy/d, vn=(b.vx-k.vx)*nx+(b.vy-k.vy)*ny;
        b.x+=nx*(m-d); b.y+=ny*(m-d);
        if(vn<0){ b.vx-=1.5*vn*nx; b.vy-=1.5*vn*ny; if(vn<-2.5){ k.hp--; sparks(k.x,k.y,'#b98d68',6,1.6); } }
      }
    }
    if(roids.length){
      const n=roids.filter(k=>k.hp<=0).length;
      if(n){ gain(n*2); sound(120,0.2,'square',0.08); }
      roids=roids.filter(k=>k.hp>0 && k.x>-100 && k.x<W+100 && k.y<H-150);
    }
    // 블랙홀: 움직이는 행성을 끌어당기고, 가운데에 닿으면 아래로 내던짐
    for(const z of holes){
      z.t++;
      const pull=0.16+Math.min(0.12,(level-7)*0.012);
      for(const b of balls){
        if(b.dead || !b.armed || Math.hypot(b.vx,b.vy)<0.6) continue;
        const dx=z.x-b.x, dy=z.y-b.y, d=Math.hypot(dx,dy);
        if(d>140) continue;
        if(d<16){ const a=Math.PI*(0.3+rand()*0.4), v=6.5/Math.sqrt(PLANETS[b.tier].size); b.vx=Math.cos(a)*v; b.vy=Math.sin(a)*v; b.x=z.x+Math.cos(a)*22; b.y=z.y+Math.sin(a)*22; sound(180,0.2,'sine',0.12); continue; }
        const a=0.04+pull*(1-d/140);
        b.vx+=dx/d*a; b.vy+=dy/d*a;
      }
    }
    if(holes.some(z=>z.t>=z.life)) holes=holes.filter(z=>z.t<z.life);
    // 태양 폭풍: 모든 행성을 아래로 밀어냄 (가벼울수록 더)
    if(flare){
      flare.t++;
      if(flare.t===120) for(const b of balls) b.vy+=(2+Math.min(1,(level-9)*0.1))/Math.sqrt(PLANETS[b.tier].size);
      if(flare.t>=170) flare=null;
    }
  }
  function catchFlyer(){
    const f=flyer, dustN=(f.id==='halley' ? 25 : 15)+PBSpace.shipBonus(f.id);
    flyer=null;
    const pts=PBShip.catchPoints();
    popped+=pts; if(popped>record) record=popped;
    gain(dustN);
    toast={ text:'+'+pts+'  ·  ✦ '+dustN, color:'#ffd98a', life:1 };
    sparks(f.x, f.y, '#ffd98a', 8, 1.6);
    sound(920, 0.25, 'sine', 0.16); JPI.vibrate(20);
    shipsThisGame++; daily('ship', 1); daily('ship1', shipsThisGame);
    if(PBSpace.catchShip(f.id)) PBSpace.shipCard(f.id);
  }

  // ───────── 규칙: 같은 행성 → 한 단계 축소, 달끼리 → 소멸 ─────────
  function shrink(b){
    popped++; until--;
    if(popped>record) record=popped;
    if(b.tier===0){
      burst(b);
      b.dead=true;
      sound(560, 0.16, 'sine', 0.2); JPI.vibrate(25);
    }else{
      b.tier--;
      b.r=radiusOf(b.tier);
      sound(330+b.tier*20, 0.08, 'square', 0.07); JPI.vibrate(8);
    }
  }

  function levelCheck(){
    if(until<=0){
      level++;
      until=quotaFor(level);
      sound(660, 0.3, 'sine', 0.18); JPI.vibrate([30,60,30]);
      flashLevel=1;
      gain(3); flyersThisLevel=0; daily('level', level);
      saveProgress();
      discoverAvailable();
    }
  }

  function burst(b){
    const p=PLANETS[b.tier];
    const n=Math.floor(16+b.r);
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=0.8+Math.random()*3;
      particles.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.4,life:1,size:1+Math.random()*2.6,color:p.color});
    }
  }
  function sparks(x,y,color,count,speed){
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2, s=speed*(0.3+Math.random());
      particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.9+Math.random()*0.3,size:0.7+Math.random()*1.8,color:color});
    }
  }

  // 게임 오버: 이번 점수와 세계 순위만 크게. 지난 기록(TOP 5)은 RANKING → MY BEST에서 봄
  function endGame(){
    running=false;

      +(dailyWon>0 ? '<div class="go-sub" style="color:#9fe0a6">DAILY GOAL ✦ '+dailyWon+'</div>' : '')
      +(popped>prevBest && popped>0 ? '<div class="go-best">NEW BEST!</div>' : '<div class="go-sub">BEST '+record+'</div>');

    overlay.classList.add('wait'); setTimeout(()=>overlay.classList.remove('wait'), 700);
    rankAfterGame(popped, level);
    sound(140, 0.5, 'sawtooth', 0.18);

  // ───────── 물리 (질량 기반) ─────────
  function physics(){
    eventStep();
    for(const [k,v] of pairCooldown){
      if(v<=1) pairCooldown.delete(k);
      else pairCooldown.set(k, v-1);
    }

    const SUB = 4;
    for(const b of balls){ b.popKicked=false; b.hits=0; }
    for(let s=0; s<SUB; s++){
      for(const b of balls){
        b.x += b.vx/SUB;
        b.y += b.vy/SUB;

        if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx)*WALL_BOUNCE; }
        if(b.x>W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx)*WALL_BOUNCE; }
        if(b.y<b.r){ b.y=b.r; b.vy=Math.abs(b.vy)*TOP_BOUNCE; }

        if(!b.armed && (b.y < H - BALL_R*3.2 || (b.vx===0 && b.vy===0))) b.armed=true;

        if(!b.dead && b.y - b.r >= H){
          if(shields>0){
            shields--; b.dead=true;
            toast={ text:shields>0 ? 'SHIELD!  '+shields+' LEFT' : 'SHIELD!  NONE LEFT', color:'#7ab8ff', life:1.2 };
            sparks(b.x, H-4, '#7ab8ff', 14, 2.2); sound(300, 0.35, 'sine', 0.18); JPI.vibrate(50);
            continue;
          }
          endGame();
          return;
        }
      }

      for(let i=0;i<balls.length;i++){
        for(let j=i+1;j<balls.length;j++){
          const a=balls[i], c=balls[j];
          if(a.dead||c.dead) continue;
          const dx=c.x-a.x, dy=c.y-a.y;
          const dist=Math.hypot(dx,dy), minD=a.r+c.r;
          const popD=minD*POP_RANGE;

          // 같은 행성: 충분한 속도로 부딪힐 때만 축소 (가만히 붙어있으면 안 됨 — 원조 방식)
          if(dist<popD && a.tier===c.tier){
            const rvx=a.vx-c.vx, rvy=a.vy-c.vy;
            const relSpeed=Math.hypot(rvx,rvy);
            const key=a.id+'-'+c.id;
            if(relSpeed>=POP_MIN_SPEED && !pairCooldown.has(key)){
              const col=PLANETS[a.tier].color;
              sparks((a.x+c.x)/2, (a.y+c.y)/2, col, 16, 2.6);
              sparks((a.x+c.x)/2, (a.y+c.y)/2, '#ffffff', 6, 1.8);
              bonkDust(a.tier); liftLeft+=8;
              popped+=PBShip.bonkScore();   // 우주선 단계마다 박치기 덤 점수
              shrink(a); shrink(c);
              if(dist>0.0001){
                const knx=dx/dist, kny=dy/dist;
                const kn=1.5/PLANETS[Math.max(0,a.tier)].size;   // 무거울수록 반동 작게
                if(!a.popKicked){ a.vx-=knx*kn; a.vy-=kny*kn; a.popKicked=true; }
                if(!c.popKicked){ c.vx+=knx*kn; c.vy+=kny*kn; c.popKicked=true; }
              }
              levelCheck();
              pairCooldown.set(key, POP_TICK);
            }
          }

          if(dist<minD && dist>0.0001){
            const nx=dx/dist, ny=dy/dist;
            const m1=massOf(a.tier), m2=massOf(c.tier);
            const total=m1+m2;
            const overlap=(minD-dist);
            // 가벼운 쪽이 더 밀려남
            a.x-=nx*overlap*(m2/total); a.y-=ny*overlap*(m2/total);
            c.x+=nx*overlap*(m1/total); c.y+=ny*overlap*(m1/total);

            // 질량 기반 충격량: 무거운 행성은 덜 흔들리고 가벼운 행성은 팽 튕김
            const rel=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;
            if(rel<0){
              const jimp=(1+RESTITUTION)*rel/(1/m1+1/m2);
              a.vx+=jimp*nx/m1;
              a.vy+=jimp*ny/m1;
              c.vx-=jimp*nx/m2;
              c.vy-=jimp*ny/m2;

              // 연쇄 감쇠: 2번째 반발부터 속도 줄임 (1대1 정면은 그대로)
              a.hits=(a.hits||0)+1;
              c.hits=(c.hits||0)+1;
              const CHAIN_DAMP=0.45;
              if(a.hits>=2){ a.vx*=CHAIN_DAMP; a.vy*=CHAIN_DAMP; }
              if(c.hits>=2){ c.vx*=CHAIN_DAMP; c.vy*=CHAIN_DAMP; }

              const impact=-rel;
              if(impact>0.6){
                const cx=(a.x+c.x)/2, cy=(a.y+c.y)/2;
                const cnt=Math.min(14, Math.floor(impact*3));
                sparks(cx, cy, PLANETS[a.tier].color, cnt, impact*0.5);
                sparks(cx, cy, PLANETS[c.tier].color, cnt, impact*0.5);
              }
            }
          }
        }
      }
      balls=balls.filter(b=>!b.dead);
    }

    const SPEED_CAP = MAX_POWER * 2;   // 가벼운 행성 발사 속도는 통과, 연쇄 과속만 차단
    for(const b of balls){
      let sp = Math.hypot(b.vx,b.vy);
      if(b.armed && sp>0.3){ b.vy+=pullOf(b.tier); sp=Math.hypot(b.vx,b.vy); }
      if(sp>SPEED_CAP){ b.vx=b.vx/sp*SPEED_CAP; b.vy=b.vy/sp*SPEED_CAP; sp=SPEED_CAP; }
      if(sp>0){
        const ns = Math.max(0, sp*FRICTION_KEEP - FRICTION_SUB);
        if(ns<STOP_SPEED){ b.vx=0; b.vy=0; }
        else { b.vx=b.vx/sp*ns; b.vy=b.vy/sp*ns; }
      }
    }

    for(let pass=0; pass<10; pass++){
      let any=false;
      for(let i=0;i<balls.length;i++){
        for(let j=i+1;j<balls.length;j++){
          const a=balls[i], c=balls[j];
          const dx=c.x-a.x, dy=c.y-a.y;
          let dist=Math.hypot(dx,dy);
          const minD=a.r+c.r;
          const sep=minD+EDGE;
          if(dist<sep){
            any=true;
            let nx, ny;
            if(dist<0.0001){ const ra=rand()*Math.PI*2; nx=Math.cos(ra); ny=Math.sin(ra); dist=0.0001; }
            else { nx=dx/dist; ny=dy/dist; }
            const overlap=Math.max(0,(sep-dist))/2;
            a.x-=nx*overlap; a.y-=ny*overlap;
            c.x+=nx*overlap; c.y+=ny*overlap;
            a.x=Math.max(a.r, Math.min(W-a.r, a.x)); if(a.y<a.r) a.y=a.r;
            c.x=Math.max(c.r, Math.min(W-c.r, c.x)); if(c.y<c.r) c.y=c.r;
          }
        }
      }
      if(!any) break;
    }
    updateHUD();
  }

  // ───────── 그리기 ─────────
  function drawHUD(){
    ctx.save();
    // 판번호 (문제 생긴 판을 알려줄 때 쓰는 번호)
    ctx.globalAlpha=0.3; ctx.fillStyle='#8a9090'; ctx.font='11px "Special Elite", monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('GAME #'+gameSeed, 8, 8);
    ctx.globalAlpha=0.42;
    ctx.fillStyle='#5e6363';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const labelSize=Math.min(W*0.058, 24);
    const valueSize=Math.min(W*0.17, 80);
    const blocks=[
      ['LEVEL', level, H*0.17],
      ['SCORE', popped, H*0.5],
      ['UNTIL NEXT LEVEL', until, H*0.83]
    ];
    for(const [label, value, cy] of blocks){
      ctx.font=labelSize+'px "Special Elite", monospace';
      ctx.fillText(label, W/2, cy - valueSize*0.62);

  // ───────── 우주 배경 (어두운 우주 + 옅은 성운 + 별) — 한 번 그려 두고 재사용 ─────────
  function seeded(seed){
    return function(){
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function buildBackground(){
    const cv=document.createElement('canvas');
    cv.width=canvas.width; cv.height=canvas.height;
    const c=cv.getContext('2d');
    c.setTransform(SCALE*DPR,0,0,SCALE*DPR,0,0);
    c.fillStyle='#04060c'; c.fillRect(0,0,W,H);
    const glow=(x,y,rad,col)=>{
      const rg=c.createRadialGradient(x,y,0,x,y,rad);
      rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=rg; c.fillRect(0,0,W,H);
    };
    glow(W*0.15, H*0.62, W*0.8, 'rgba(70,45,130,0.12)');
    glow(W*0.85, H*0.2,  W*0.7, 'rgba(30,75,150,0.12)');
    const rnd=seeded(7);
    for(let i=0;i<190;i++){
      const tint = rnd();
      const col = tint<0.12 ? '170,200,255' : tint<0.2 ? '255,215,170' : '255,255,255';
      c.fillStyle='rgba('+col+','+(0.25+rnd()*0.7).toFixed(2)+')';
      c.beginPath(); c.arc(rnd()*W, rnd()*H, 0.35+rnd()*1.05, 0, Math.PI*2); c.fill();
    }
    return cv;
  }
  function drawBackground(){
    if(!bgCache) bgCache=buildBackground();
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bgCache,0,0); ctx.restore();
  }

  // ───────── 행성 ─────────
  // 행성마다 펼친 지도(질감)를 만들어 두고, 공 모양에 감아서 그림. 지도를 옆으로 밀면 천천히 자전함
  const PERIOD=[48,40,34,70,26,22,24,16,13,0];      // 한 바퀴 도는 데 걸리는 초 (태양은 표면 고정, 빛살만 회전)
  // 규칙: 클수록 주변 빛(후광)이 더 밝고 넓어짐
  function haloReach(t){ return 1.18 + 0.025*t; }
  function haloAlpha(t){ return 0.07 + 0.04*t; }
  const RINGS={
    6:{tilt:1.25, rx:1.42, ry:0.3, layers:[[1,'rgba(225,245,255,0.75)',0.05],[1.12,'rgba(200,235,250,0.4)',0.03]]},
    7:{tilt:-0.32, rx:1.55, ry:0.42, layers:[[1.12,'rgba(240,222,180,0.7)',0.08],[1,'rgba(222,196,140,0.92)',0.16],[0.86,'rgba(170,140,95,0.85)',0.09]]}
  };
  const ATMO={3:'rgba(255,220,150,0.35)', 4:'rgba(140,200,255,0.6)', 5:'rgba(140,175,255,0.5)', 6:'rgba(190,240,250,0.5)'};
  function padOf(t){
    if(t===9) return 1.05;
    let p=haloReach(t)+0.02;
    if(t===7) p=Math.max(p,1.8);
    if(t===6) p=Math.max(p,1.64);
    return p;
  }
  function circlePath(c, r){ c.beginPath(); c.arc(0,0,r,0,Math.PI*2); }
  function rgba(hex, a){
    const n=parseInt(hex.slice(1),16);
    return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';
  }
  function blob(c, x, y, sx, sy, rnd){
    const n=9, pts=[];
    for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, k=0.55+rnd()*0.7; pts.push([x+Math.cos(a)*sx*k, y+Math.sin(a)*sy*k]); }
    const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
    c.beginPath();
    const m0=mid(pts[0],pts[1]); c.moveTo(m0[0],m0[1]);
    for(let i=1;i<=n;i++){ const p=pts[i%n], m=mid(p,pts[(i+1)%n]); c.quadraticCurveTo(p[0],p[1],m[0],m[1]); }
    c.closePath(); c.fill();
  }

  const textures=[];
  function texture(tier){ return textures[tier] || (textures[tier]=makeTexture(tier)); }
  function makeTexture(tier){
    const w = tier>=5 ? 512 : 256, h = w/2, S = w/256;
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const c=cv.getContext('2d');
    const rnd=seeded(500+tier*131);
    const wrap=fn=>{ for(const dx of [-w,0,w]){ c.save(); c.translate(dx,0); fn(); c.restore(); } };
    const fill=col=>{ c.fillStyle=col; c.fillRect(0,0,w,h); };
    const speckle=(n,cols,r0,r1,a0,a1)=>{
      for(let i=0;i<n;i++){
        const x=rnd()*w, y=rnd()*h, rr=(r0+rnd()*(r1-r0))*S;
        c.globalAlpha=a0+rnd()*(a1-a0); c.fillStyle=cols[(rnd()*cols.length)|0];
        wrap(()=>{ c.beginPath(); c.arc(x,y,rr,0,Math.PI*2); c.fill(); });
      }
      c.globalAlpha=1;
    };
    const craters=(n,r0,r1,dark,light)=>{
      for(let i=0;i<n;i++){
        const x=rnd()*w, y=h*(0.12+rnd()*0.76), rr=(r0+rnd()*(r1-r0))*S;
        wrap(()=>{
          c.fillStyle=dark; c.beginPath(); c.ellipse(x,y,rr*1.3,rr,0,0,Math.PI*2); c.fill();
          c.strokeStyle=light; c.lineWidth=Math.max(1,rr*0.3);
          c.beginPath(); c.ellipse(x,y,rr*1.2,rr*0.92,0,Math.PI*0.05,Math.PI*0.95); c.stroke();
        });
      }
    };
    const blobs=(n,cols,sx0,sx1,y0,y1)=>{
      for(let i=0;i<n;i++){
        const x=rnd()*w, y=h*(y0+rnd()*(y1-y0)), sx=(sx0+rnd()*(sx1-sx0))*S, col=cols[(rnd()*cols.length)|0];
        const seed=rnd()*1e9|0;
        wrap(()=>{ c.fillStyle=col; blob(c,x,y,sx,sx*0.6,seeded(seed)); });
      }
    };
    const bands=(cols,h0,h1,amp,alpha)=>{
      let y=0; c.globalAlpha=alpha;
      while(y<h){
        const bh=(h0+rnd()*(h1-h0))*h, col=cols[(rnd()*cols.length)|0];
        const k=1+((rnd()*3)|0), ph=rnd()*6.28, ph2=rnd()*6.28;
        c.fillStyle=col; c.beginPath();
        c.moveTo(0, y+Math.sin(ph)*amp*h);
        for(let x=4;x<=w;x+=4) c.lineTo(x, y+Math.sin(x/w*Math.PI*2*k+ph)*amp*h);
        for(let x=w;x>=0;x-=4) c.lineTo(x, y+bh+Math.sin(x/w*Math.PI*2*k+ph2)*amp*h);
        c.closePath(); c.fill();
        y+=bh;
      }
      c.globalAlpha=1;
    };
    const caps=(col,top,bottom)=>{
      c.fillStyle=col;
      const edge=(y0,dir,size)=>{
        c.beginPath(); c.moveTo(0,y0);
        for(let x=0;x<=w;x+=4) c.lineTo(x, y0+dir*(size+Math.sin(x/w*Math.PI*6+tier)*size*0.35)*h);
        c.lineTo(w,y0); c.closePath(); c.fill();
      };
      if(top) edge(0,1,top);
      if(bottom) edge(h,-1,bottom);
    };

    switch(tier){
      case 0: // 달
        fill('#b5b8be');
        speckle(500,['#c9cbd0','#9da0a6'],1,3,0.15,0.35);
        blobs(6,['rgba(105,108,116,0.45)'],14,30,0.25,0.75);
        craters(28,2,6,'rgba(122,125,132,0.6)','rgba(236,237,241,0.5)');
        break;
      case 1: // 수성
        fill('#8a7765');
        speckle(600,['#9d8a77','#6d5d4f'],1,3,0.2,0.4);
        craters(42,1.5,5,'rgba(88,74,62,0.65)','rgba(212,196,176,0.45)');
        break;
      case 2: // 화성
        fill('#c4552c');
        speckle(500,['#d66c3b','#a8421e'],1,4,0.2,0.4);
        blobs(8,['rgba(108,38,16,0.5)'],10,26,0.25,0.75);
        blobs(4,['rgba(235,150,90,0.35)'],12,22,0.3,0.7);
        caps('rgba(255,255,255,0.92)',0.07,0.05);
        break;
      case 3: // 금성
        fill('#d9a95a');
        bands(['#f0d18e','#c8923f','#e6bd72'],0.05,0.12,0.03,0.55);
        speckle(300,['#f5dca6','#b9853c'],2,6,0.08,0.18);
        break;
      case 4: // 지구
        fill('#1c5bb2');
        speckle(300,['#2a6cc4','#154b98'],3,8,0.2,0.4);
        blobs(7,['#3d8b3d','#4a9a43','#367d38'],18,36,0.22,0.78);
        blobs(4,['rgba(176,146,86,0.75)'],8,14,0.35,0.65);
        caps('rgba(245,250,255,0.95)',0.08,0.08);
        for(let i=0;i<26;i++){
          const x=rnd()*w, y=h*(0.1+rnd()*0.8), rx=(10+rnd()*26)*S, ry=(2+rnd()*3)*S, rot=(rnd()-0.5)*0.3;
          c.fillStyle='rgba(255,255,255,'+(0.35+rnd()*0.3).toFixed(2)+')';
          wrap(()=>{ c.beginPath(); c.ellipse(x,y,rx,ry,rot,0,Math.PI*2); c.fill(); });
        }
        break;
      case 5: // 해왕성
        fill('#2d52c4');
        bands(['#3a64d6','#2446ab','#4a74e0'],0.05,0.12,0.02,0.5);
        c.fillStyle='#152c7c'; wrap(()=>{ c.beginPath(); c.ellipse(w*0.35,h*0.62,w*0.045,h*0.06,0,0,Math.PI*2); c.fill(); });
        for(let i=0;i<8;i++){
          const x=rnd()*w, y=h*(0.25+rnd()*0.5), rx=(12+rnd()*18)*S;
          c.fillStyle='rgba(225,235,255,0.55)';
          wrap(()=>{ c.beginPath(); c.ellipse(x,y,rx,1.6*S,0,0,Math.PI*2); c.fill(); });
        }
        break;
      case 6: // 천왕성
        fill('#7fd0dd');
        bands(['#8ad8e4','#74c3d1','#93dde8'],0.08,0.18,0.01,0.35);
        break;
      case 7: // 토성
        fill('#e0c487');
        bands(['#ecd7a2','#d4b06f','#c9a262','#f0dfb2','#b8925a'],0.03,0.08,0.008,0.8);
        break;
      case 8: // 목성
        fill('#d8b48a');
        bands(['#efe0c6','#c58556','#e2c39b','#a8663f','#f3e7d2','#b97a4e'],0.035,0.09,0.012,0.9);
        speckle(400,['#f3e7d2','#b0704a'],2,6,0.08,0.2);
        wrap(()=>{
          c.fillStyle='#bf543a'; c.beginPath(); c.ellipse(w*0.3,h*0.64,w*0.045,h*0.05,0,0,Math.PI*2); c.fill();
          c.strokeStyle='rgba(245,225,200,0.7)'; c.lineWidth=2*S; c.stroke();
        });
        break;
      case 9: // 태양
        fill('#ffc93a');
        speckle(2600,['#ffe27a','#ffb21f','#fff1a8'],0.5,1.6,0.18,0.38);
        break;
    }
    return { data:c.getImageData(0,0,w,h).data, w, h };
  }

  // 공 모양에 지도를 감기 위한 화면 픽셀 → (경도, 위도, 밝기) 표. 빛은 왼쪽 위 앞에서 비춤
  const LIGHT=(()=>{ const l=[-0.5,-0.45,0.74], m=Math.hypot(l[0],l[1],l[2]); return l.map(v=>v/m); })();
  function sphereMap(R, tex, isSun){
    const size=R*2, idx=[], lonU=[], row=[], lit=[];
    for(let j=0;j<size;j++){
      const ny=(j+0.5-R)/R;
      for(let i=0;i<size;i++){
        const nx=(i+0.5-R)/R, d=nx*nx+ny*ny;
        if(d>=1) continue;
        const nz=Math.sqrt(1-d), lat=Math.asin(ny), cl=Math.cos(lat);
        const lon=Math.asin(Math.max(-1, Math.min(1, nx/cl)));
        idx.push((j*size+i)*4);
        lonU.push(lon/(Math.PI*2)*tex.w);
        row.push(Math.min(tex.h-1, Math.floor((lat/Math.PI+0.5)*tex.h))*tex.w*4);
        const dot=nx*LIGHT[0]+ny*LIGHT[1]+nz*LIGHT[2];
        lit.push(isSun ? 0.8+0.25*nz : 0.28+0.85*Math.max(0,dot));
      }
    }
    return { size, idx:Int32Array.from(idx), lonU:Float32Array.from(lonU), row:Int32Array.from(row), lit:Float32Array.from(lit) };
  }
  function paintSurface(map, tex, shift, img){
    const d=img.data, t=tex.data, tw=tex.w, n=map.idx.length;
    const idx=map.idx, lonU=map.lonU, row=map.row, lit=map.lit;
    for(let k=0;k<n;k++){
      let u=(lonU[k]-shift)%tw; if(u<0) u+=tw;
      const s=row[k]+((u|0)<<2), o=idx[k], L=lit[k];
      d[o]=t[s]*L; d[o+1]=t[s+1]*L; d[o+2]=t[s+2]*L; d[o+3]=255;
    }
  }
  function drawRing(c, r, ring, half){
    c.save(); c.rotate(ring.tilt);
    const a0 = half==='back' ? Math.PI : 0;
    for(const [k, col, w] of ring.layers){
      c.strokeStyle=col; c.lineWidth=w*r;
      c.beginPath(); c.ellipse(0,0,ring.rx*r*k,ring.ry*r*k,0,a0,a0+Math.PI); c.stroke();
    }
    c.restore();
  }
  // 후광 → 고리 뒤쪽 → 표면 → 대기 테두리 → 고리 앞쪽 순서로 겹쳐 그림
  function composePlanet(c, tier, r, surf){
    if(tier!==9){
      const reach=r*haloReach(tier), g=c.createRadialGradient(0,0,r*0.9,0,0,reach);
      g.addColorStop(0, rgba(PLANETS[tier].color, haloAlpha(tier)));
      g.addColorStop(1, rgba(PLANETS[tier].color, 0));
      c.fillStyle=g; circlePath(c,reach); c.fill();
    }
    const ring=RINGS[tier];
    if(ring) drawRing(c,r,ring,'back');
    c.save(); circlePath(c,r); c.clip(); c.drawImage(surf,-r,-r,r*2,r*2); c.restore();
    if(ATMO[tier]){
      // 대기: 흐림 대신 넓고 옅은 테두리를 한 번 더 그림 (흐림은 폰을 뜨겁게 함)
      c.save(); c.strokeStyle=ATMO[tier]; c.globalAlpha=0.35; c.lineWidth=r*0.2; circlePath(c,r*1.02); c.stroke();
      c.globalAlpha=1; c.lineWidth=r*0.07; circlePath(c,r*0.98); c.stroke(); c.restore();
    }
    if(ring) drawRing(c,r,ring,'front');
  }
  // 태양: 빛 번짐이 천천히 숨 쉬고, 빛살이 천천히 돎
  function sunCorona(c, r, t){
    const pulse=1+0.04*Math.sin(t*1.3);
    const glow=c.createRadialGradient(0,0,r*0.85,0,0,r*1.7*pulse);
    glow.addColorStop(0,'rgba(255,190,70,0.6)'); glow.addColorStop(1,'rgba(255,120,0,0)');
    c.fillStyle=glow; circlePath(c,r*1.7*pulse); c.fill();
    c.save(); c.rotate(t*0.06);
    c.fillStyle='rgba(255,165,35,0.85)';
    const rnd=seeded(99), n=26;
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2, w=Math.PI/n*0.7, tip=r*(1.1+rnd()*0.16);
      c.beginPath();
      c.moveTo(Math.cos(a-w)*r*0.96, Math.sin(a-w)*r*0.96);
      c.lineTo(Math.cos(a)*tip, Math.sin(a)*tip);
      c.lineTo(Math.cos(a+w)*r*0.96, Math.sin(a+w)*r*0.96);
      c.closePath(); c.fill();
    }
    c.restore();
  }

  // 필드용: 행성 종류마다 그림 하나를 두고, 몇 프레임마다 자전시켜 다시 그림 (같은 행성은 모두 같은 그림 공유)
  function planetEntry(tier){
    let e=spriteCache.get(tier);
    if(e) return e;
    const tex=texture(tier), r=radiusOf(tier), k=SCALE*DPR;
    const R=Math.max(4, Math.round(r*k));
    const map=sphereMap(R, tex, tier===9);
    const surf=document.createElement('canvas'); surf.width=surf.height=map.size;
    const sc=surf.getContext('2d'), img=sc.createImageData(map.size, map.size);
    const ext=r*padOf(tier), px=Math.max(2, Math.ceil(ext*2*k));
    const sprite=document.createElement('canvas'); sprite.width=sprite.height=px;
    e={tier, tex, r, k, map, surf, sc, img, ext, px, sprite, drawn:false};
    spriteCache.set(tier, e);
    return e;
  }
  function renderEntry(e, shift){
    paintSurface(e.map, e.tex, shift, e.img);
    e.sc.putImageData(e.img, 0, 0);
    const c=e.sprite.getContext('2d');
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,e.px,e.px);
    c.setTransform(e.k,0,0,e.k,e.px/2,e.px/2);
    composePlanet(c, e.tier, e.r, e.surf);
    e.drawn=true;
  }
  let frameNo=0, animT=0;
  function animatePlanets(now){
    frameNo++; animT=now/1000;
    const seen=new Set();
    for(const b of balls) seen.add(b.tier);
    for(const t of seen){
      const e=planetEntry(t);
      if(t===9){ if(!e.drawn) renderEntry(e,0); continue; }
      if(e.drawn && (frameNo+t)%3) continue;     // 행성마다 3프레임에 한 번씩 나눠서 갱신
      renderEntry(e, animT/PERIOD[t]*e.tex.w);
    }
  }
  function drawBall(b){
    const e=planetEntry(b.tier);
    if(!e.drawn) renderEntry(e,0);
    if(b.tier===9){ ctx.save(); ctx.translate(b.x,b.y); sunCorona(ctx, e.r, animT); ctx.restore(); }
    ctx.drawImage(e.sprite, b.x-e.ext, b.y-e.ext, e.ext*2, e.ext*2);
  }

  function drawAim(){
    if(!aiming || !running) return;
    const lp=launcherPos();
    const dx=aimX-lp.x, dy=aimY-lp.y;
    const mag=Math.hypot(dx,dy);
    if(mag<1) return;
    const ext=Math.min(mag, 130);   // 짧은 조준선: 어디로 갈지는 감으로
    ctx.save();
    const fade=ctx.createLinearGradient(lp.x, lp.y, lp.x+dx/mag*ext, lp.y+dy/mag*ext);
    fade.addColorStop(0,'rgba(255,255,255,0.8)'); fade.addColorStop(1,'rgba(255,255,255,0.05)');
    ctx.strokeStyle=fade;
    ctx.lineWidth=2;
    ctx.shadowColor='rgba(255,255,255,0.8)';
    ctx.shadowBlur=0;
    ctx.beginPath();
    ctx.moveTo(lp.x, lp.y);
    ctx.lineTo(lp.x+dx/mag*ext, lp.y+dy/mag*ext);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(aimX, aimY, 34, 0, Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fill();
    ctx.restore();
  }

  function drawParticles(){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.02; p.life-=0.022;
      if(p.life<=0){ particles.splice(i,1); continue; }
      ctx.globalAlpha=Math.max(0, Math.min(1, p.life));
      ctx.fillStyle=p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha=1;
  }

  function drawLevelFlash(){
    if(flashLevel<=0) return;
    flashLevel-=0.012;
    ctx.save();
    ctx.globalAlpha=Math.max(0, Math.min(flashLevel,0.85));
    ctx.fillStyle='#e8eaea';
    ctx.font=Math.min(W*0.12,44)+'px "Special Elite", monospace';
    ctx.textAlign='center';
    ctx.shadowBlur=0;
    ctx.fillText('LEVEL '+level, W/2, H*0.5);
    if(level>1 && UNLOCK.includes(level)){
      ctx.font=Math.min(W*0.06,22)+'px "Special Elite", monospace';
      ctx.fillText(PLANETS[UNLOCK.indexOf(level)].name.toUpperCase()+' UNLOCKED', W/2, H*0.5+Math.min(W*0.1,38));
    }
    // 레벨이 오를 때 지금 점수와 최고 점수를 잠깐 보여줌
    ctx.font='17px "Special Elite", monospace';
    ctx.fillText('SCORE '+popped+'  ·  BEST '+record, W/2, H*0.5+70);
    ctx.restore();
  }
  // 위쪽에 잠깐 나오는 알림
  function drawToast(){
    if(!toast) return;
    toast.life-=0.01;
    if(toast.life<=0){ toast=null; return; }
    ctx.save();
    ctx.globalAlpha=Math.min(1, toast.life*3);
    ctx.font='20px "Special Elite", monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=toast.color;
    ctx.fillText(toast.text, W/2, 40);
    ctx.restore();
  }
  function drawShield(){
    if(shields<=0) return;
    ctx.save();
    ctx.strokeStyle='rgba(122,184,255,0.55)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(4,H-3); ctx.lineTo(W-4,H-3); ctx.stroke();
    ctx.fillStyle='rgba(122,184,255,0.8)';
    for(let i=0;i<shields;i++){ ctx.beginPath(); ctx.arc(14+i*14, H-14, 4, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  // 바닥에 가까워 위험한 행성은 붉은 테두리로 알려줌
  function drawDanger(){
    if(!running) return;
    const a=0.45+0.3*Math.sin(animT*5);
    ctx.save(); ctx.strokeStyle='rgba(255,90,80,'+a.toFixed(2)+')'; ctx.lineWidth=2.5;
    for(const b of balls){
      if(!b.armed || b.y<H-46 || Math.hypot(b.vx,b.vy)>1) continue;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r+3,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }
  function drawFlyer(){
    if(!flyer) return;
    ctx.save(); ctx.translate(flyer.x, flyer.y); if(flyer.dir<0) ctx.scale(-1,1);
    PBSpace.drawShip(ctx, flyer.id, 15, animT);
    ctx.restore();
  }
  function rockPath(r, n, seed){ ctx.beginPath(); for(let i=0;i<n;i++){ const q=r*(0.8+0.25*((i*37+seed)%5)/4), a=i/n*Math.PI*2; ctx.lineTo(Math.cos(a)*q, Math.sin(a)*q); } ctx.closePath(); }
  function drawHazard(){
    for(const z of holes){
      ctx.save(); ctx.globalAlpha=Math.max(0, Math.min(1, z.t/40, (z.life-z.t)/40));
      const g=ctx.createRadialGradient(z.x,z.y,14,z.x,z.y,140);
      g.addColorStop(0,'rgba(120,90,200,0.28)'); g.addColorStop(1,'rgba(60,40,120,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(z.x,z.y,140,0,Math.PI*2); ctx.fill();
      ctx.translate(z.x,z.y); ctx.rotate(z.t*0.02);
      ctx.strokeStyle='rgba(183,156,255,0.6)'; ctx.lineWidth=2; ctx.setLineDash([26,12]);
      ctx.beginPath(); ctx.arc(0,0,21,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // 우주 쓰레기: 부서진 인공위성 조각
    for(const k of junk){
      ctx.save(); ctx.translate(k.x,k.y); ctx.rotate(k.a+animT*0.15);
      ctx.fillStyle=k.hp>1 ? '#69737b' : '#434a50'; ctx.strokeStyle='#97a2aa'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.rect(-k.r*0.6,-k.r*0.55,k.r*1.2,k.r*1.1); ctx.fill(); ctx.stroke();
      ctx.fillStyle=k.hp>1 ? '#3d5f8c' : '#2a3f5c'; ctx.fillRect(k.r*0.6,-k.r*0.35,k.r*0.45,k.r*0.7);
      ctx.beginPath(); ctx.moveTo(-k.r*0.6,0); ctx.lineTo(-k.r*1.05,-k.r*0.45); ctx.moveTo(-k.r*0.3,-k.r*0.55); ctx.lineTo(k.r*0.2,k.r*0.5); ctx.stroke();
      ctx.restore();
    }
    for(const k of roids){
      ctx.save(); ctx.translate(k.x,k.y);
      const m=Math.hypot(k.vx,k.vy)||1, tx=-k.vx/m*k.r*3, ty=-k.vy/m*k.r*3, g=ctx.createLinearGradient(0,0,tx,ty);
      g.addColorStop(0,'rgba(200,140,90,0.35)'); g.addColorStop(1,'rgba(200,140,90,0)');
      ctx.strokeStyle=g; ctx.lineWidth=k.r*1.2; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(tx,ty); ctx.stroke();
      ctx.rotate(k.a); ctx.fillStyle=k.hp>1 ? '#7a6250' : '#55443a'; ctx.strokeStyle='#a98c74'; ctx.lineWidth=1.2;
      rockPath(k.r, 8, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(k.r*0.25,-k.r*0.2,k.r*0.22,0,Math.PI*2); ctx.arc(-k.r*0.3,k.r*0.25,k.r*0.16,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    if(flare){
      ctx.save();
      const push=flare.t<120 ? 0.12+0.08*Math.sin(flare.t*0.2) : 0.3*(1-(flare.t-120)/50);
      const g=ctx.createLinearGradient(0,0,0,H*0.55);
      g.addColorStop(0,'rgba(255,150,50,'+Math.max(0,push).toFixed(3)+')'); g.addColorStop(1,'rgba(255,100,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.55); ctx.restore();
    }
  }

  // 화면 주사율과 무관하게 초당 60번만 진행 (120Hz 화면에서 2배속이 되지 않게)
  const STEP_MS = 1000/60;
  let lastFrameT = 0, frameAcc = 0;
  function frameDue(t){
    frameAcc += Math.min(100, Math.max(0, t - lastFrameT)); lastFrameT = t;
    if(frameAcc < STEP_MS - 1.5) return false;
    frameAcc = Math.min(Math.max(frameAcc - STEP_MS, 0), STEP_MS);
    return true;
  }
  // 쉬기: 첫 페이지는 바뀔 게 없어서 한 번만 그림, MY SPACE가 덮고 있으면 안 그림, 카드 등으로 멈췄을 땐 1초에 10번만
  let pauseTick=0, slowT=0, slowN=0, lastT=0;
  function calm(){
    if(flyer || roids.length || flare || particles.length || toast || flashLevel>0 || sinkLeft>0 || liftLeft>0) return false;
    for(const b of balls) if(b.vx!==0 || b.vy!==0) return false;
    return true;
  }
  function resting(){
    if(document.getElementById('space').classList.contains('on')) return true;
    // 첫 페이지·게임 오버: 움직이는 게 없으므로 한 번 그리고 쉼
    if(!running && !overlay.classList.contains('hidden')){ if(idleDrawn) return true; idleDrawn=true; return false; }
    idleDrawn=false;
    if(running && JPI.isOpen()) return (++pauseTick)%6!==0;
    // 아무것도 움직이지 않으면(행성 자전만) 1초에 20번만
    if(running && !aiming && calm()) return (++pauseTick)%3!==0;
    return false;
  }
  // 느린 폰: 한 장 그리는 데 오래 걸리는 상태가 계속되면 해상도를 낮춤
  function watchSpeed(t){
    const dt=t-lastT; lastT=t;
    if(dt>0 && dt<200 && running && !JPI.isOpen()){ slowT+=dt; slowN++; }
    if(slowN>=120){
      if(slowT/slowN>26 && DPR_MAX>1){ DPR_MAX=Math.max(1, DPR_MAX-0.5); resize(); }
      slowT=0; slowN=0;
    }
  }
  function loop(t){
    const now=t === undefined ? performance.now() : t;
    if(frameDue(now) && !resting()){
      watchSpeed(now);
      drawBackground();
      // 메뉴 화면이 떠 있을 때는 뒤에 비치는 숫자(LEVEL 등)를 그리지 않음
      if(overlay.classList.contains('hidden')) drawHUD();
      if(running && !JPI.isOpen()) physics();
      animatePlanets(t === undefined ? performance.now() : t);
      // 첫 페이지에서는 하던 게임의 행성을 그리지 않음
      if(!document.body.classList.contains('on-menu')){
        drawHazard();
        drawShield();
        drawAim();
        for(const b of balls) drawBall(b);
        drawDanger();
        drawFlyer();
        drawParticles();
        drawLevelFlash();
        drawToast();
      }
    }
    requestAnimationFrame(loop);
  }
  loop();

  // ───────── 메뉴 ─────────
  loadRecord();
  updateHUD();

  const resumeBtn = document.getElementById('resume-btn');

  // 메뉴(시작) 화면 — 저장본 있으면 '이어하기'가 크게(주), '새 게임'이 작게(보조)
  function showMenu(){
    running=false;
    overlayTitle.textContent='PLANET BONK';
    overlayStats.style.display='none';
    overlayHint.style.display='none';
    rankLine.style.display='none';
    const hasSave = !!loadProgress();
    if(hasSave){
      resumeBtn.style.display='inline-block';
      resumeBtn.classList.remove('secondary');
      resumeBtn.style.order='0';
      startBtn.textContent='NEW GAME';
      startBtn.classList.add('secondary');
      startBtn.style.order='1';
    }else{
      resumeBtn.style.display='none';
      startBtn.textContent='START';
      startBtn.classList.remove('secondary');
      startBtn.style.order='0';
    }
    renderGuideBtn();
    showOverlay('menu');
  }
  function beginGame(fresh){
    hideOverlay();
    overlayStats.style.display='none';
    resize();
    if(fresh){ newGame(); }
    else { const saved=loadProgress(); if(saved) restoreGame(saved); else newGame(); }
    if(JPI.on('music')!==bgm.isOn()) bgm.toggle();
    discoverAvailable();
    // 폰이 저장 공간을 비울 때 기록을 지우지 않도록 요청
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  }

  // 앱을 끄거나 뒤로 가는 등 화면을 벗어날 때 즉시 저장
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden'){ saveProgress(); bgm.sleep(); }
    else bgm.wake();
  });

  const GUIDE_KEY='pb-guide';
  function loadGuide(){
    try{ const g=JSON.parse(localStorage.getItem(GUIDE_KEY)); if(Array.isArray(g)) return g; }catch(e){}
    return [];
  }
  function isFound(t){ return loadGuide().includes(t); }
  function markFound(t){
    const g=loadGuide();
    if(!g.includes(t)){ g.push(t); try{ localStorage.setItem(GUIDE_KEY, JSON.stringify(g)); }catch(e){} }
  }
  function foundCount(){ return loadGuide().filter(t=>t>=0 && t<PLANETS.length).length; }

  function loadSeen(){ try{ const g=JSON.parse(localStorage.getItem(SEEN_KEY)); if(Array.isArray(g)) return g; }catch(e){} return []; }

  let cardQueue=[], cardOpen=false, cardNow=-1;
  function discoverAvailable(){
    for(let t=0;t<=maxTier();t++){
      markFound(t);
      if(t!==cardNow && !cardQueue.includes(t) && !loadSeen().includes(t)) cardQueue.push(t);
    }
    nextCard();
  }
  function nextCard(){
    if(cardOpen || !cardQueue.length) return;
    cardOpen=true;
    cardNow=cardQueue.shift();
    showPlanetCard(cardNow, ()=>{ markSeen(cardNow); cardNow=-1; cardOpen=false; nextCard(); });
  }
  function spinner(cv, tier, css, skinTex){
    const draw=planetPainter(cv, tier, css, true, skinTex);
    const period=PERIOD[tier]||40, t0=performance.now();
    let alive=true;
    (function frame(){
      if(!alive || !cv.isConnected){ alive=false; return; }
      const s=(performance.now()-t0)/1000;
      draw(s/period*2, s);
      requestAnimationFrame(frame);
    })();
    return ()=>{ alive=false; };
  }

    const size=document.createElement('div'); size.className='pb-size'; size.textContent=f.size;
    wrap.append(cv, name, type, size);
    return { wrap, cv, f };

  function lockedIcon(cv, css){
    const d=Math.min(window.devicePixelRatio||1, 2);
    cv.width=cv.height=Math.round(css*d);
    const c=cv.getContext('2d'); c.setTransform(d,0,0,d,css*d/2,css*d/2);
    const r=css*0.36;
    c.fillStyle='#0d1010'; c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fill();
    c.strokeStyle='#2f3535'; c.lineWidth=1.5; c.stroke();
    c.fillStyle='#4e5454'; c.font=(r*1.1)+'px "Special Elite", monospace';
    c.textAlign='center'; c.textBaseline='middle'; c.fillText('?',0,2);
  }
